<polygon fill="none" stroke="blue" points="800,-547 258,-547 258,-511 800,-511 800,-547"/>
<text text-anchor="middle" x="529" y="-525.3" font-family="Times New Roman,serif" font-size="14.00">You laid down your life for your superior officer. I felt your selflessness like a slap in the face.</text>
</g>
