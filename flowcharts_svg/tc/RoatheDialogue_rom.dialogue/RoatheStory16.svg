<polygon fill="none" stroke="blue" points="1029.62,-416.5 84.38,-416.5 84.38,-380.5 1029.62,-380.5 1029.62,-416.5"/>
<text xml:space="preserve" text-anchor="middle" x="557" y="-393.07" font-family="Times New Roman,serif" font-size="14.00">瑪麗娜。你把身體給了我。在那戰壕裡，我們一起喝下赤毒。我的雙手在顫抖，割開的喉嚨在滲血，但我保留了足夠的液滴讓它起效。</text>
</g>
