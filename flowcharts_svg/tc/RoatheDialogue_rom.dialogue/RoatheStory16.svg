<text xml:space="preserve" text-anchor="middle" x="557" y="-304.57" font-family="Times New Roman,serif" font-size="14.00">我記得你最後的敬禮。你漸漸消逝。然後我眨開曾經是你的雙眼，看到我被掏空的屍體死在泥濘中。</text>
