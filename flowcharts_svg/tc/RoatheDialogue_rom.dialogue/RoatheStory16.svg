<g id="node7" class="node">
<title>j4048380357</title>
<polygon fill="none" stroke="blue" points="762,-488 352,-488 352,-452 762,-452 762,-488"/>
<text text-anchor="middle" x="557" y="-466.3" font-family="Times New Roman,serif" font-size="14.00">你為上級軍官獻出了生命。我感到你的無私如一記耳光。</text>
</g>
