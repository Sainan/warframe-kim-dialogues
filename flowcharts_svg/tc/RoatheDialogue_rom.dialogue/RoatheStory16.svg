<!-- j4114764156 -->
<g id="node8" class="node">
<title>j4114764156</title>
<polygon fill="none" stroke="blue" points="1030,-415 84,-415 84,-379 1030,-379 1030,-415"/>
<text text-anchor="middle" x="557" y="-393.3" font-family="Times New Roman,serif" font-size="14.00">瑪麗娜。你把身體給了我。在那戰壕裡，我們一起喝下赤毒。我的雙手在顫抖，割開的喉嚨在滲血，但我保留了足夠的液滴讓它起效。</text>
</g>
