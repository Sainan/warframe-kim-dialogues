<g id="node9" class="node">
<title>j4059051776</title>
<polygon fill="none" stroke="blue" points="912,-328 202,-328 202,-292 912,-292 912,-328"/>
<text text-anchor="middle" x="557" y="-306.3" font-family="Times New Roman,serif" font-size="14.00">我記得你最後的敬禮。你漸漸消逝。然後我眨開曾經是你的雙眼，看到我被掏空的屍體死在泥濘中。</text>
</g>
