<text text-anchor="middle" x="557" y="-539.3" font-family="Times New Roman,serif" font-size="14.00">文字記錄：特雷文。我看著你把銳捷號投入普拉咖薩的巨口。她分心了，貪婪地吞食你和你的部下，從未注意到我自己的船正在加速逃離。</text>
</g>
