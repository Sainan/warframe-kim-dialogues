<polygon fill="none" stroke="blue" points="1100,-780 28,-780 28,-744 1100,-744 1100,-780"/>
<text text-anchor="middle" x="564" y="-758.3" font-family="Times New Roman,serif" font-size="14.00">他們就是這麼叫我的，不是嗎？我讀過散落在這塵封的大廳裡的歷史書籍。謊言。他們不知道真相。我還來不及完成我的任務，就從我的時代被奪走了。</text>
