<text text-anchor="middle" x="604" y="-758.3" font-family="Times New Roman,serif" font-size="14.00">That is what they called me, isn’t it? I’ve read the history books scattered about this dusty hall. A lie. They did not know the truth. That I was ripped away from my time before I could complete my work.</text>
