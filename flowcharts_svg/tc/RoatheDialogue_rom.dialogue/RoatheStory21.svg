<text xml:space="preserve" text-anchor="middle" x="564" y="-612.08" font-family="Times New Roman,serif" font-size="14.00">我現在想起來了。他在金色大廳接近我。他戴著一張我不認識的臉。但這對我們這種人來說並不罕見。我認得他的聲音。我認得他的舉止。</text>
