<text text-anchor="middle" x="622" y="-393.3" font-family="Times New Roman,serif" font-size="14.00">我們的祖先當年是如何馴服 Infestation 的？當然是像撕開玫瑰花蕾一樣，撕開原子的核心！</text>
</g>
