<text text-anchor="middle" x="419.74" y="-466.3" font-family="Times New Roman,serif" font-size="14.00">她的眼神閃耀著某種宇宙巨大玩笑的喜悅，彷彿對我說道，跳下去吧。</text>
</g>
<!-- j2124435525&#45;&gt;j1462483172 -->
<g id="edge8" class="edge">
