<text text-anchor="middle" x="510.74" y="-233.3" font-family="Times New Roman,serif" font-size="14.00">她的飢渴無窮無盡。某天晚上她召喚我到她的浴池。我跨過混合著香水和鮮血的水窪，盡職地立正站好。</text>
