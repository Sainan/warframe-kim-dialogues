<text text-anchor="middle" x="495.29" y="-466.3" font-family="Times New Roman,serif" font-size="14.00">爭幾乎已輸；Sentient 無法被戰勝；那麼，讓我們創造這些奇異而超現實的戰士，用古老血統的武器武裝他們。</text>
</g>
