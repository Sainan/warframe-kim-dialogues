<polygon fill="none" stroke="blue" points="1136,-488 28,-488 28,-452 1136,-452 1136,-488"/>
<text text-anchor="middle" x="582" y="-466.3" font-family="Times New Roman,serif" font-size="14.00">文字記錄：許多 Sentient 在交戰之間進化，所以我們永遠無法確定會面對同樣的敵人兩次。但其他的保持一致的形態，彷彿它們很久以前就達到了某個平台期。</text>
</g>
