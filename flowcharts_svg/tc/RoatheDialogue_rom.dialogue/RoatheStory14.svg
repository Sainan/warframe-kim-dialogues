<text text-anchor="middle" x="582" y="-306.3" font-family="Times New Roman,serif" font-size="14.00">這太瘋狂了。我該如何針對 Sentient 蟹形船的行為制定戰略？當我的戰術剛被完善，蟹形船就被蟲形船取代了。</text>
