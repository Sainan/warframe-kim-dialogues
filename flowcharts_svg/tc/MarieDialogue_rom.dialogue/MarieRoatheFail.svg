<text text-anchor="middle" x="1653" y="-428.3" font-family="Times New Roman,serif" font-size="14.00">我正試著說服羅瑟幫助我們讓 Loid 和源拓氏家族團圓。但他對服用血清這件事很固執。我需要你幫忙跟他談談。</text>
