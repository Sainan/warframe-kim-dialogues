<text xml:space="preserve" text-anchor="middle" x="615" y="-516.58" font-family="Times New Roman,serif" font-size="14.00">謝謝！我們為什麼、怎麼來到這裡，這恐怕是個很長的故事。我們是主教派來的。我相信你認識他，叫阿爾布雷希特．源拓氏？他把那個藍皮膚的討厭鬼託付給我們。</text>
