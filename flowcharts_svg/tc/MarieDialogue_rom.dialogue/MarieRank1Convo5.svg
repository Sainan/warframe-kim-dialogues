<g id="node4" class="node">
<title>j2147420864</title>
<polygon fill="none" stroke="blue" points="1206.5,-756 25.5,-756 25.5,-720 1206.5,-720 1206.5,-756"/>
<text text-anchor="middle" x="616" y="-734.3" font-family="Times New Roman,serif" font-size="14.00">我是瑪麗・勒魯修女，但你可以叫我瑪麗。我最近和我的靈魂弟兄里昂・阿拉德神父一起來到這裡，還有……嗯，我想 Loid 先生可能已經警告過你那個惡魔了，對不對？</text>
</g>
<!-- j1426412165&#45;&gt;j2147420864 -->
<g id="edge3" class="edge">
