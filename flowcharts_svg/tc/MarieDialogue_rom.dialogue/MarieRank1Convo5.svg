<text xml:space="preserve" text-anchor="middle" x="615" y="-877.33" font-family="Times New Roman,serif" font-size="14.00">你好！你一定就是漂泊者了，對吧？Loid 先生跟我說了好多關於你的事。我非常高興能在這個……</text>
