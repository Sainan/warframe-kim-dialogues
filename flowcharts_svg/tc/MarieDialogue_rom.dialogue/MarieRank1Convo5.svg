<text xml:space="preserve" text-anchor="middle" x="615" y="-661.33" font-family="Times New Roman,serif" font-size="14.00">很高興認識你。別誤會我的意思，這裡歡迎你們，但是……你們來這裡幹嘛？</text>
</g>
