<text xml:space="preserve" text-anchor="middle" x="1752" y="-516.58" font-family="Times New Roman,serif" font-size="14.00">是的，就是主教託付給我們的那個藍皮膚的討厭鬼。我相信你認識他，叫阿爾布雷希特．源拓氏？他就是我們來這裡的原因。但那恐怕是個很長的故事。</text>
