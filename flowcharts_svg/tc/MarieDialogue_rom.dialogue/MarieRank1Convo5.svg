<g id="node4" class="node">
<title>j2147420864</title>
<polygon fill="none" stroke="blue" points="1205,-756 25,-756 25,-720 1205,-720 1205,-756"/>
<text xml:space="preserve" text-anchor="middle" x="615" y="-733.33" font-family="Times New Roman,serif" font-size="14.00">我是瑪麗・勒魯修女，但你可以叫我瑪麗。我最近和我的靈魂弟兄里昂・阿拉德神父一起來到這裡，還有……嗯，我想 Loid 先生可能已經警告過你那個惡魔了，對不對？</text>
</g>
<!-- j1426412165&#45;&gt;j2147420864 -->
