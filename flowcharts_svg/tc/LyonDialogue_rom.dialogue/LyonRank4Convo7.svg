<text text-anchor="middle" x="606" y="-590.3" font-family="Times New Roman,serif" font-size="14.00">我常覺得自己像塊空白的畫布，在上面胡亂抹著油彩——徒勞地試圖勾勒出我腦海中所見圖像的輪廓。</text>
</g>
