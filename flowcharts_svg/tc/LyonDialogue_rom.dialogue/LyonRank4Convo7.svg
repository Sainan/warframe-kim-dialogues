<polygon fill="none" stroke="blue" points="1024,-756 188,-756 188,-720 1024,-720 1024,-756"/>
<text text-anchor="middle" x="606" y="-734.3" font-family="Times New Roman,serif" font-size="14.00">對我來說，與人交談很困難。尤其是在親密的交流中，比起通過冷冰冰的機器或是寫信，面對面交流更讓我不知所措。</text>
