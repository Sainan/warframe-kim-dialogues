<polygon fill="none" stroke="blue" points="1038,-684 326,-684 326,-648 1038,-648 1038,-684"/>
<text text-anchor="middle" x="682" y="-662.3" font-family="Times New Roman,serif" font-size="14.00">我不知道該如何形容 ─ 只能說……就像我拼命想抓住什麼東西，卻眼睜睜地看著灰塵從指縫間溜走。 </text>
</g>
