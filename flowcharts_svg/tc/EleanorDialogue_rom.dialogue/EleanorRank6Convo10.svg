<text text-anchor="middle" x="413" y="-466.3" font-family="Times New Roman,serif" font-size="14.00">然後我想，好吧，管它的，不如徹底放飛自我，愛做什麼就做什麼，因為反正你總是可以再次敲打地板來重置一切</text>
