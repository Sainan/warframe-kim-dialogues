<text xml:space="preserve" text-anchor="middle" x="622.25" y="-516.58" font-family="Times New Roman,serif" font-size="14.00">然而隔天，那張照片已傳遍世界各地的大街小巷。校園裡的每個人都看過了。分享了。傳給了你的指導教授們。傳遍了整個網際網路。甚至是傳到了連我都不知道有存在的國家。</text>
