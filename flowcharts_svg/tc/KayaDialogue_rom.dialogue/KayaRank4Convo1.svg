<text xml:space="preserve" text-anchor="middle" x="622.25" y="-300.57" font-family="Times New Roman,serif" font-size="14.00">但對我來說，它毀了我的人生。我想生活在一個沒有網路的未來。我想證明我能夠從這個事件中走出來。回到過去只會證明他們是對的，證明我無法從中走出去。</text>
