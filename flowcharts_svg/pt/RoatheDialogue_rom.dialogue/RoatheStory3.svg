<text xml:space="preserve" text-anchor="middle" x="608" y="-393.45" font-family="Times New Roman,serif" font-size="14.00">Por muito tempo, o Império Orokin não teve inimigos. Seu exército existia somente para resolver pequenas disputas, casa contra casa, Executor contra Executor.</text>
