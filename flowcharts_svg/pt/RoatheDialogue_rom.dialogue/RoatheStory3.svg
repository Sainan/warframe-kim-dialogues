<text xml:space="preserve" text-anchor="middle" x="608" y="-320.45" font-family="Times New Roman,serif" font-size="14.00">Quando os Sentients atacaram, conhecemos uma união que nos fora negada por muito tempo. Os Dax desembainharam suas espadas contra algo além de um camponês insolente ou um comerciante desonesto.</text>
