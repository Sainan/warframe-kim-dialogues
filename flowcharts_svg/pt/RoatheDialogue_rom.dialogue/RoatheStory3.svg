<g id="node6" class="node">
<title>j1574343460</title>
<polygon fill="none" stroke="blue" points="1080,-415 162,-415 162,-379 1080,-379 1080,-415"/>
<text text-anchor="middle" x="621" y="-393.3" font-family="Times New Roman,serif" font-size="14.00">Por muito tempo, o Império Orokin não teve inimigos. Seu exército existia somente para resolver pequenas disputas, casa contra casa, Executor contra Executor.</text>
</g>
