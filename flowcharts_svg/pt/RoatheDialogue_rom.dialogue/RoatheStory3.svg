<text text-anchor="middle" x="621" y="-320.3" font-family="Times New Roman,serif" font-size="14.00">Quando os Sentients atacaram, conhecemos uma união que nos fora negada por muito tempo. Os Dax desembainharam suas espadas contra algo além de um camponês insolente ou um comerciante desonesto.</text>
</g>
