<text text-anchor="middle" x="621" y="-233.3" font-family="Times New Roman,serif" font-size="14.00">Os Imperadores, os governantes imortais do Império, cujo poder residia nos Executores, despertaram abruptamente em seus tronos dourados e empoeirados.</text>
</g>
