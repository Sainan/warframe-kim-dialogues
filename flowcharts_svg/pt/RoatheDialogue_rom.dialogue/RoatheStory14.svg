<g id="node8" class="node">
<title>j3515658119</title>
<polygon fill="none" stroke="blue" points="1240,-328 244,-328 244,-292 1240,-292 1240,-328"/>
<text text-anchor="middle" x="742" y="-306.3" font-family="Times New Roman,serif" font-size="14.00">Era insano. Como eu poderia elaborar estratégias em torno do comportamento das naves Sentients, se quando minhas táticas eram aperfeiçoadas, as naves já haviam evoluído?</text>
</g>
