<text text-anchor="middle" x="742" y="-160.3" font-family="Times New Roman,serif" font-size="14.00">Tudo o que podíamos fazer era retroceder. O progresso havia sido fatal. As antigas tradições, os caminhos consagrados pelo tempo, de honra e disciplina, mereciam o seu devido valor.</text>
