<text xml:space="preserve" text-anchor="middle" x="731" y="-304.95" font-family="Times New Roman,serif" font-size="14.00">Era insano. Como eu poderia elaborar estratégias em torno do comportamento das naves Sentients, se quando minhas táticas eram aperfeiçoadas, as naves já haviam evoluído?</text>
