<polygon fill="none" stroke="blue" points="1433.88,-489.5 28.12,-489.5 28.12,-453.5 1433.88,-453.5 1433.88,-489.5"/>
<text xml:space="preserve" text-anchor="middle" x="731" y="-466.45" font-family="Times New Roman,serif" font-size="14.00">Muitos dos Sentients evoluíram entre os encontros, então nunca podíamos ter certeza de que enfrentaríamos o mesmo inimigo duas vezes. Mas outros permaneceram com a mesma forma, como se tivessem atingido um patamar elevado há muito tempo.</text>
</g>
