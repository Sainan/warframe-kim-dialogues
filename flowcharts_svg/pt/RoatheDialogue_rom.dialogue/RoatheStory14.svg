<!-- j3984924143 -->
<g id="node6" class="node">
<title>j3984924143</title>
<polygon fill="none" stroke="blue" points="1456,-488 28,-488 28,-452 1456,-452 1456,-488"/>
<text text-anchor="middle" x="742" y="-466.3" font-family="Times New Roman,serif" font-size="14.00">Muitos dos Sentients evoluíram entre os encontros, então nunca podíamos ter certeza de que enfrentaríamos o mesmo inimigo duas vezes. Mas outros permaneceram com a mesma forma, como se tivessem atingido um patamar elevado há muito tempo.</text>
</g>
