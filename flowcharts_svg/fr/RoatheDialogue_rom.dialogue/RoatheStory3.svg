<text text-anchor="middle" x="597" y="-320.3" font-family="Times New Roman,serif" font-size="14.00">Lorsque les Sentients attaquèrent, nous fûmes unis, une unité qui nous avait longtemps fait défaut. Les Dax dégainèrent leurs épées contre autre chose qu&#39;un paysan insolent ou un marchand malhonnête.</text>
</g>
