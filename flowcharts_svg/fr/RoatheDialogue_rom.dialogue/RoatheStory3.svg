<text text-anchor="middle" x="597" y="-233.3" font-family="Times New Roman,serif" font-size="14.00">Les Empereurs, les souverains immortels de l&#39;Empire dont le pouvoir était dévolu aux Exécuteurs, s&#39;éveillèrent en titubant sur leurs trônes dorés poussiéreux.</text>
</g>
