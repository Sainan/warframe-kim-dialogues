<text text-anchor="middle" x="597" y="-393.3" font-family="Times New Roman,serif" font-size="14.00">Transcription: pendant si longtemps, l’Empire Orokin n’eut aucun ennemi. Son armée n’existait que pour régler de mesquines querelles, maison contre maison, Exécuteur contre Exécuteur.</text>
</g>
