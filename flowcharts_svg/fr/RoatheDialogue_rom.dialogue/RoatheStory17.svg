<text text-anchor="middle" x="571" y="-233.3" font-family="Times New Roman,serif" font-size="14.00">Les Warframes étaient apparues dans le ciel, telles des anges, libérant les captifs et dévastant les forteresses Sentients. Même seules, elles étaient des miracles; en groupe, elles étaient des dieux.</text>
