<text text-anchor="middle" x="571" y="-306.3" font-family="Times New Roman,serif" font-size="14.00">Mais contre toute attente, ils triomphèrent. Bientôt, des récits d&#39;un héroïsme invraisemblable parvinrent du front.</text>
