<text text-anchor="middle" x="497" y="-466.3" font-family="Times New Roman,serif" font-size="14.00">La guerre était pratiquement perdue; les Sentients étaient invincibles; créons donc ces guerriers étranges et surréalistes et équipons&#45;les d&#39;armes d&#39;une lignée ancestrale.</text>
</g>
