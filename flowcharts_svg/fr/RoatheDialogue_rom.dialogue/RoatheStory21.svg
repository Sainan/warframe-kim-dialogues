<!-- j3766262445 -->
<g id="node7" class="node">
<title>j3766262445</title>
<polygon fill="none" stroke="blue" points="1290,-780 28,-780 28,-744 1290,-744 1290,-780"/>
<text text-anchor="middle" x="659" y="-758.3" font-family="Times New Roman,serif" font-size="14.00">C’est comme ça qu’ils m’appelaient, n’est&#45;ce pas? J’ai lu les livres d’histoire éparpillés dans ce hall poussiéreux. Un mensonge. Ils ignoraient la vérité. Que j’ai été arraché à mon époque avant d’avoir pu achever mon œuvre.</text>
</g>
