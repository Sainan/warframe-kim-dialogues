<polygon fill="none" stroke="blue" points="1220.5,-634 97.5,-634 97.5,-598 1220.5,-598 1220.5,-634"/>
<text text-anchor="middle" x="659" y="-612.3" font-family="Times New Roman,serif" font-size="14.00">Je me souviens, maintenant. Il s&#39;est approché de moi, dans les Salles Dorées. Son visage m&#39;était inconnu. Mais ce n&#39;est pas si inhabituel chez nous. Je connaissais sa voix. Je connaissais sa démarche.</text>
</g>
