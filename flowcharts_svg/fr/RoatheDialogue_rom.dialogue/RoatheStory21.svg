<polygon fill="none" stroke="blue" points="1202.75,-635.5 99.25,-635.5 99.25,-599.5 1202.75,-599.5 1202.75,-635.5"/>
<text xml:space="preserve" text-anchor="middle" x="651" y="-612.45" font-family="Times New Roman,serif" font-size="14.00">Je me souviens, maintenant. Il s&#39;est approché de moi, dans les Salles Dorées. Son visage m&#39;était inconnu. Mais ce n&#39;est pas si inhabituel chez nous. Je connaissais sa voix. Je connaissais sa démarche.</text>
