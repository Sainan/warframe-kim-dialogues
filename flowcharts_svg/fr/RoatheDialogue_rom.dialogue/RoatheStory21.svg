<polygon fill="none" stroke="blue" points="1274,-781.5 28,-781.5 28,-745.5 1274,-745.5 1274,-781.5"/>
<text xml:space="preserve" text-anchor="middle" x="651" y="-758.45" font-family="Times New Roman,serif" font-size="14.00">C’est comme ça qu’ils m’appelaient, n’est&#45;ce pas? J’ai lu les livres d’histoire éparpillés dans ce hall poussiéreux. Un mensonge. Ils ignoraient la vérité. Que j’ai été arraché à mon époque avant d’avoir pu achever mon œuvre.</text>
</g>
