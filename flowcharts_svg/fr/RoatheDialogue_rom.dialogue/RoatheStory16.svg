<!-- j645900795 -->
<g id="node9" class="node">
<title>j645900795</title>
<polygon fill="none" stroke="blue" points="1000,-328 232,-328 232,-292 1000,-292 1000,-328"/>
<text text-anchor="middle" x="616" y="-306.3" font-family="Times New Roman,serif" font-size="14.00">I remember your last salute. The fading. Then I blinked open the eyes that had been yours, and saw my gutted corpse dead in the mud.</text>
</g>
