<text xml:space="preserve" text-anchor="middle" x="607" y="-393.45" font-family="Times New Roman,serif" font-size="14.00">Maryna. Tu m&#39;as offert ton corps. Ensemble, dans cette tranchée, nous avons bu du Kuva. Mes mains tremblaient et ma gorge, lacérée, saignait, mais j&#39;ai réussi à garder suffisamment de gouttes pour survivre.</text>
</g>
