<!-- j14400189 -->
<g id="node7" class="node">
<title>j14400189</title>
<polygon fill="none" stroke="blue" points="887,-488 345,-488 345,-452 887,-452 887,-488"/>
<text text-anchor="middle" x="616" y="-466.3" font-family="Times New Roman,serif" font-size="14.00">You laid down your life for your superior officer. I felt your selflessness like a slap in the face.</text>
</g>
<!-- j2403142124&#45;&gt;j14400189 -->
<g id="edge7" class="edge">
<title>j2403142124&#45;&gt;j14400189</title>
<path fill="none" stroke="black" d="M616,-524.81C616,-517.23 616,-508.1 616,-499.54"/>
<polygon fill="black" stroke="black" points="619.5,-499.54 616,-489.54 612.5,-499.54 619.5,-499.54"/>
