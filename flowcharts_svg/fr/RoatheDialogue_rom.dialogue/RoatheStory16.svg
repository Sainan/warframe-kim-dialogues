<!-- j3709488338 -->
<g id="node8" class="node">
<title>j3709488338</title>
<polygon fill="none" stroke="blue" points="1090,-415 142,-415 142,-379 1090,-379 1090,-415"/>
<text text-anchor="middle" x="616" y="-393.3" font-family="Times New Roman,serif" font-size="14.00">Maryna. You gave me your body. Together, in that trench, we drank Kuva. My hands shook and my gashed throat leaked, but I kept enough drops down for it to take.</text>
</g>
<!-- j14400189&#45;&gt;j3709488338 -->
<g id="edge8" class="edge">
<title>j14400189&#45;&gt;j3709488338</title>
