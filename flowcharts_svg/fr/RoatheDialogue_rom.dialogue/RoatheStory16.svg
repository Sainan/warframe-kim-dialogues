<text text-anchor="middle" x="616" y="-233.3" font-family="Times New Roman,serif" font-size="14.00">Rostig. &quot;Il y a eu un problème lors du clonage&quot;, ont&#45;ils dit. Qu&#39;est&#45;ce qui pourrait bien pousser un Grineer à rester dans sa tourelle tout en brûlant vif? Même un rat a l&#39;instinct de survie!</text>
</g>
