<!-- j3297432922 -->
<g id="node7" class="node">
<title>j3297432922</title>
<polygon fill="none" stroke="blue" points="851,-488 381,-488 381,-452 851,-452 851,-488"/>
<text text-anchor="middle" x="616" y="-466.3" font-family="Times New Roman,serif" font-size="14.00">Tu as donné ta vie pour ton supérieur. J&#39;ai ressenti ton altruisme comme une gifle.</text>
</g>
