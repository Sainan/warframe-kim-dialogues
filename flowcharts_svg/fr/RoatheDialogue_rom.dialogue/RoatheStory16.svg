<!-- j2323523293 -->
<g id="node9" class="node">
<title>j2323523293</title>
<polygon fill="none" stroke="blue" points="1017,-328 211,-328 211,-292 1017,-292 1017,-328"/>
<text text-anchor="middle" x="614" y="-306.3" font-family="Times New Roman,serif" font-size="14.00">Je me souviens de ton dernier salut. La fin. Puis j&#39;ai ouvert les yeux qui avaient été les tiens et j&#39;ai vu mon cadavre éventré, gisant dans la boue.</text>
</g>
