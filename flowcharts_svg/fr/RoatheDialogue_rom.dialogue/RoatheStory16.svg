<text xml:space="preserve" text-anchor="middle" x="607" y="-304.95" font-family="Times New Roman,serif" font-size="14.00">Je me souviens de ton dernier salut. La fin. Puis j&#39;ai ouvert les yeux qui avaient été les tiens et j&#39;ai vu mon cadavre éventré, gisant dans la boue.</text>
