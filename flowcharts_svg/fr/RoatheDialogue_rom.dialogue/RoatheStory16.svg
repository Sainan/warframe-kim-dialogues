<!-- j1582305589 -->
<g id="node8" class="node">
<title>j1582305589</title>
<polygon fill="none" stroke="blue" points="1200,-415 28,-415 28,-379 1200,-379 1200,-415"/>
<text text-anchor="middle" x="614" y="-393.3" font-family="Times New Roman,serif" font-size="14.00">Maryna. Tu m&#39;as offert ton corps. Ensemble, dans cette tranchée, nous avons bu du Kuva. Mes mains tremblaient et ma gorge, lacérée, saignait, mais j&#39;ai réussi à garder suffisamment de gouttes pour survivre.</text>
</g>
