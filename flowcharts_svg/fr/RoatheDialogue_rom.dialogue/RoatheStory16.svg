<text xml:space="preserve" text-anchor="middle" x="609" y="-466.45" font-family="Times New Roman,serif" font-size="14.00">Tu as donné ta vie pour ton supérieur. J&#39;ai ressenti ton altruisme comme une gifle.</text>
