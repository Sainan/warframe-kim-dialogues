<!-- 2278 -->
<g id="node10" class="node">
<title>2278</title>
<polygon fill="none" stroke="blue" points="972,-401 204,-401 204,-365 972,-365 972,-401"/>
<text text-anchor="middle" x="588" y="-379.3" font-family="Times New Roman,serif" font-size="14.00">I remember your last salute. The fading. Then I blinked open the eyes that had been yours, and saw my gutted corpse dead in the mud.</text>
</g>
