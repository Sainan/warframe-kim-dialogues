<text text-anchor="middle" x="588" y="-598.3" font-family="Times New Roman,serif" font-size="14.00">Transcription: Traivon. Je t’ai vu précipiter ton Railjack dans la gueule du Praghasa. Distrait, se repaissant avidement de toi et de tes hommes, il n’a même pas remarqué mon vaisseau s’éloigner à toute vitesse.</text>
</g>
