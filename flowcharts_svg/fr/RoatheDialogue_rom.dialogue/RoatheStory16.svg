<polygon fill="none" stroke="blue" points="1204,-561 28,-561 28,-525 1204,-525 1204,-561"/>
<text text-anchor="middle" x="616" y="-539.3" font-family="Times New Roman,serif" font-size="14.00">Transcription: Traivon. Je t’ai vu précipiter ton Railjack dans la gueule du Praghasa. Distrait, se repaissant avidement de toi et de tes hommes, il n’a même pas remarqué mon vaisseau s’éloigner à toute vitesse.</text>
</g>
