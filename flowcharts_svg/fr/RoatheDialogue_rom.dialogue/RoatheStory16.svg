<!-- 5714 -->
<g id="node9" class="node">
<title>5714</title>
<polygon fill="none" stroke="blue" points="1062,-474 114,-474 114,-438 1062,-438 1062,-474"/>
<text text-anchor="middle" x="588" y="-452.3" font-family="Times New Roman,serif" font-size="14.00">Maryna. You gave me your body. Together, in that trench, we drank Kuva. My hands shook and my gashed throat leaked, but I kept enough drops down for it to take.</text>
</g>
