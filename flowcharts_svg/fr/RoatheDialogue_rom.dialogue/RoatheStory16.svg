<!-- 5713 -->
<g id="node8" class="node">
<title>5713</title>
<polygon fill="none" stroke="blue" points="859,-547 317,-547 317,-511 859,-511 859,-547"/>
<text text-anchor="middle" x="588" y="-525.3" font-family="Times New Roman,serif" font-size="14.00">You laid down your life for your superior officer. I felt your selflessness like a slap in the face.</text>
</g>
