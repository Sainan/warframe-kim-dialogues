<text text-anchor="middle" x="758" y="-233.3" font-family="Times New Roman,serif" font-size="14.00">Et combien de temps avant que ces vaisseaux ne soient eux&#45;mêmes remplacés par quelque nouvelle monstruosité?</text>
</g>
