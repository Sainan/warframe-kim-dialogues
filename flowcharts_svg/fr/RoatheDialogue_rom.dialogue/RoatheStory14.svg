<text text-anchor="middle" x="758" y="-466.3" font-family="Times New Roman,serif" font-size="14.00">Transcription: nombre de Sentients évoluaient entre les rencontres, si bien que nous ne pouvions jamais être certains d’affronter deux fois le même ennemi. Mais d’autres conservaient une forme constante, comme s’ils avaient atteint un palier depuis longtemps.</text>
