<text text-anchor="middle" x="758" y="-306.3" font-family="Times New Roman,serif" font-size="14.00">C&#39;était de la folie. Comment aurais&#45;je pu élaborer une stratégie face au comportement des vaisseaux Sentients, alors qu&#39;à peine mes tactiques étaient&#45;elles au point que ces vaisseaux&#45;crabes étaient remplacés par des vaisseaux&#45;vers?</text>
</g>
