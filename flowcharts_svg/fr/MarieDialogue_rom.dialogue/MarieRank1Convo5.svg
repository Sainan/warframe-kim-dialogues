<text xml:space="preserve" text-anchor="middle" x="684" y="-732.95" font-family="Times New Roman,serif" font-size="14.00">Je suis Sœur Marie Leroux, mais tu peux m&#39;appeler Marie. Je suis venue récemment avec mon frère d&#39;âme, le Père Lyon Allard et... eh bien, je crois que Monsieur Loid a dû te mettre en garde contre le diable, n&#39;est&#45;ce pas?</text>
