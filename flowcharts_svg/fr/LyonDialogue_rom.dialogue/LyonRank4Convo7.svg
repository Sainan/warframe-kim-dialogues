<text text-anchor="middle" x="588.5" y="-374.3" font-family="Times New Roman,serif" font-size="14.00">Voilà pourquoi je t&#39;évitais, au début. Et pourquoi je suis encore... sujet à des accès de solitude. Les mots me manquent.</text>
