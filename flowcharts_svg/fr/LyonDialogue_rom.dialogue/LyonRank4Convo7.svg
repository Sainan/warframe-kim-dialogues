<polygon fill="none" stroke="blue" points="1093,-612 82,-612 82,-576 1093,-576 1093,-612"/>
<text text-anchor="middle" x="587.5" y="-590.3" font-family="Times New Roman,serif" font-size="14.00">J&#39;ai souvent l&#39;impression d&#39;être un morceau de toile vierge, étalant de la peinture à l&#39;huile sur sa surface, tentant vainement de créer l&#39;ombre d&#39;une image que je vois dans mon esprit.</text>
</g>
