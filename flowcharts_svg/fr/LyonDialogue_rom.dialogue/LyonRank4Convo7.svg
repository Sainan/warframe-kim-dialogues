<text text-anchor="middle" x="588.5" y="-446.3" font-family="Times New Roman,serif" font-size="14.00">Plus j&#39;essaie, plus cela m&#39;échappe. Alors, j&#39;ai tout simplement appris... à ne même pas essayer.</text>
