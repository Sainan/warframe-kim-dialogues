<text xml:space="preserve" text-anchor="middle" x="584.25" y="-588.95" font-family="Times New Roman,serif" font-size="14.00">J&#39;ai souvent l&#39;impression d&#39;être un morceau de toile vierge, étalant de la peinture à l&#39;huile sur sa surface, tentant vainement de créer l&#39;ombre d&#39;une image que je vois dans mon esprit.</text>
</g>
