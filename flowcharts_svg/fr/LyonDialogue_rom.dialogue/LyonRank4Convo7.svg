<text xml:space="preserve" text-anchor="middle" x="584.25" y="-660.95" font-family="Times New Roman,serif" font-size="14.00">Je ne sais pas comment le décrire, si ce n&#39;est que c&#39;est... comme si j&#39;essayais d&#39;attraper quelque chose, pour ne voir que des grains de poussière m&#39;échapper entre les doigts. </text>
</g>
