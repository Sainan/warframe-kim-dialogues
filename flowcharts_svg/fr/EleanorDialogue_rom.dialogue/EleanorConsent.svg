<text text-anchor="middle" x="625" y="-466.3" font-family="Times New Roman,serif" font-size="14.00">Pardon. Je venais vraiment te demander ton consentement. Je sais que nous n&#39;en avons jamais parlé auparavant. Je voulais m&#39;assurer que tout ça te convenait.</text>
