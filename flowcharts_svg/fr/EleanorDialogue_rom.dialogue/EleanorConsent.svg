<polygon fill="none" stroke="blue" points="1100,-634 28,-634 28,-598 1100,-598 1100,-634"/>
<text text-anchor="middle" x="564" y="-612.3" font-family="Times New Roman,serif" font-size="14.00">La réponse est un &quot;oui bien sûr&quot; boudeur et les bras croisés, tandis que je reste assise ici sans penser à toi en train de t&#39;ébattre avec cette très belle chose que j&#39;ai entrevue dans tes fantasmes.</text>
</g>
