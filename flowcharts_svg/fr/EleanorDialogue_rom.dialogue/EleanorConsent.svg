<text text-anchor="middle" x="584" y="-539.3" font-family="Times New Roman,serif" font-size="14.00">Ce sont donc maintenant MES fantasmes, alors que je suis coincée ici, à cette époque et à cet endroit, merci bien!</text>
</g>
