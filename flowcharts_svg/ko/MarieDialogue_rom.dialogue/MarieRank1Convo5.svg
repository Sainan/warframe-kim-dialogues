<text text-anchor="middle" x="1958.5" y="-878.3" font-family="Times New Roman,serif" font-size="14.00">Bonjour, bonjour ! 당신이 드리프터군요, oui ? Monsieur 로이드께서 당신에 대해 정말 많은 이야기를 해주셨답니다. 이런 식으로 &quot;만나게&quot; 되어 정말 반가워요...</text>
