<text text-anchor="middle" x="886.5" y="-734.3" font-family="Times New Roman,serif" font-size="14.00">저는 Soeur 마리 르루입니다만, 마리라고 불러주셔도 되요. 최근 제 영혼의 형제인 리온 알라드 신부와 함께 이 곳으로 왔고... 음, Monsieur 로이드께서 악마에 대해 경고 하셨을거라 생각합니다, n&#39;est&#45;ce pas ?</text>
