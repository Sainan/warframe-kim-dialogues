<text xml:space="preserve" text-anchor="middle" x="2443.12" y="-517.33" font-family="Times New Roman,serif" font-size="14.00">Oui, le Cardinal께서 우리에게 맡기신 ce monstre irritant à la peau bleue. 당신은 그분을 알브레히트 엔트라티로 알고 계시지 않나요? 그분이 바로 우리가 여기에 있는 이유지만, 그건 아주 긴 이야기에요, j&#39;en ai bien peur.</text>
