<text xml:space="preserve" text-anchor="middle" x="885.12" y="-517.33" font-family="Times New Roman,serif" font-size="14.00">Merci ! 우리가 여기 온 이유와 방법은 아주 긴 이야기에요, j&#39;en ai bien peur. 우리는 le Cardinal에 의해 파견되어 왔습니다. 그 분을 알브레히트 엔트라티라고 알고 계시지 않으신가요? 그분께서 우리에게 그 푸른 피부의 monstre irritant를 맡기셨습니다.</text>
</g>
