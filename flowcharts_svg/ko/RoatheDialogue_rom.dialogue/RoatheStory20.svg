<polygon fill="none" stroke="blue" points="696.34,-488 137.34,-488 137.34,-452 696.34,-452 696.34,-488"/>
<text text-anchor="middle" x="416.84" y="-466.3" font-family="Times New Roman,serif" font-size="14.00">“Lackey,” they called me. “Lapdog.” Nitokh thought herself in control. How subtly I guided her. </text>
</g>
