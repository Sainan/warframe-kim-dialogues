<polygon fill="none" stroke="blue" points="1392,-780 28,-780 28,-744 1392,-744 1392,-780"/>
<text text-anchor="middle" x="710" y="-758.3" font-family="Times New Roman,serif" font-size="14.00">그렇게 불리나 보군. 아닌가? 이 먼지투성이 홀에 널려 있는 역사서들을 읽어보았다. 거짓이지. 놈들은 진실을 모른다. 내가 과업을 완수하기도 전에 내가 살던 시대로부터 끌려 나가고 말았다는 것을.</text>
</g>
