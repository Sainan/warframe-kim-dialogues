<text text-anchor="middle" x="710" y="-612.3" font-family="Times New Roman,serif" font-size="14.00">이제야 기억이 난다. 그 황금빛 홀에서, 놈이 내게 접근해 왔다. 내가 모르는 얼굴을 입고 있었지만, 우리에겐 그리 드문 일도 아니지. 목소리로, 움직이는 방식으로 이미 알아볼 수 있었다.</text>
