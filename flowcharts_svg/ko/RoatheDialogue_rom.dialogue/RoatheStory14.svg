<text xml:space="preserve" text-anchor="middle" x="781" y="-305.32" font-family="Times New Roman,serif" font-size="14.00">미쳐 돌아가는 노릇이었다. 센티언트의 게형 함선에 대한 전략을 완벽히 수립한 지 얼마 되지도 않아 그 게형 함선이 지렁이형 함선으로 바뀐다면, 어떻게 게형 함선의 행동 패턴을 전략화하란 말인가?</text>
