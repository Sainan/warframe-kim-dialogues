<text text-anchor="middle" x="799" y="-393.3" font-family="Times New Roman,serif" font-size="14.00">마리나. 너는 내게 네 몸을 바쳤지. 그 참호 속에서, 우리는 쿠바를 함께 마셨다. 내 손이 덜덜 떨리는 가운데 꿰뚫린 나의 목은 액체를 넘기지 못하고 흘렸지만, 효과가 발휘되는 데 필요한 몇 방울만큼은 끝내 넘겼지.</text>
