<text xml:space="preserve" text-anchor="middle" x="799" y="-539.83" font-family="Times New Roman,serif" font-size="14.00">구술 기록: 트레이본. 네 레일잭을 프라가사의 아가리에 내던지듯 돌격시키던 네 모습을 보았다. 너와 네 부하들을 탐욕스럽게 집어삼키는 데에 정신이 팔려, 프라가사는 정작 내 함선이 재빨리 달아나는 것을 눈치채지 못했지.</text>
</g>
