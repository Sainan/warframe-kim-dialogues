<text text-anchor="middle" x="500" y="-393.3" font-family="Times New Roman,serif" font-size="14.00">Transcript: For so long the Orokin Empire had no enemies. Its military existed merely to pursue petty grudges, house against house, Executor against Executor.</text>
</g>
