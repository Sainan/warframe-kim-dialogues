<text text-anchor="middle" x="504" y="-140.8" font-family="Times New Roman,serif" font-size="14.00">그래서 내가 처음부터 쥐들을 키웠던 거야&#13;</text>
<text text-anchor="middle" x="504" y="-125.8" font-family="Times New Roman,serif" font-size="14.00">쥐들의 수명은 짧지만 그들의 삶 자체를 잊지 않으니까&#13;</text>
<text text-anchor="middle" x="504" y="-110.8" font-family="Times New Roman,serif" font-size="14.00">그들이 얻을 수 있는 모든 부스러기들에서 기쁨을 찾기 위해&#13;</text>
<text text-anchor="middle" x="504" y="-95.8" font-family="Times New Roman,serif" font-size="14.00">그리고 그들에게 바친 모든 사랑을 되돌려주기 위해서&#13;</text>
<text text-anchor="middle" x="504" y="-80.8" font-family="Times New Roman,serif" font-size="14.00">그런 것들이 언제 사라질지 모르잖아</text>
</g>
