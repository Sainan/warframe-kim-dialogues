<text xml:space="preserve" text-anchor="middle" x="668" y="-876.95" font-family="Times New Roman,serif" font-size="14.00">Bonjour, bonjour ! You must be the Drifter, oui ? Monsieur Loid has told me so very much about you. I am so very pleased to &quot;meet&quot; you on this...</text>
</g>
