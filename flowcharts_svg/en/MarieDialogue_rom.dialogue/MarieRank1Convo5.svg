<polygon fill="none" stroke="blue" points="1260.62,-756 75.38,-756 75.38,-720 1260.62,-720 1260.62,-756"/>
<text xml:space="preserve" text-anchor="middle" x="668" y="-732.95" font-family="Times New Roman,serif" font-size="14.00">I am Sœur Marie Leroux, but you may call me Marie. I have recently come here with the brother of my soul, Father Lyon Allard and... well, I think Monsieur Loid may have warned you of the devil, n&#39;est&#45;ce pas ?</text>
</g>
<!-- j1232032049&#45;&gt;j2186130974 -->
<g id="edge3" class="edge">
