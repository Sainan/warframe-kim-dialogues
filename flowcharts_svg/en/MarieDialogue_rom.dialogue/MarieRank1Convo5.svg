<polygon fill="none" stroke="red" points="991.75,-684 344.25,-684 344.25,-648 991.75,-648 991.75,-684"/>
<text xml:space="preserve" text-anchor="middle" x="668" y="-660.95" font-family="Times New Roman,serif" font-size="14.00">It&#39;s lovely to meet you. And don&#39;t take this the wrong way, you&#39;re welcome here, but... what are you all doing here?</text>
</g>
