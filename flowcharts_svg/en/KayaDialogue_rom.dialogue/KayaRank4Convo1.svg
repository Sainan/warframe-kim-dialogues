<text xml:space="preserve" text-anchor="middle" x="530.38" y="-516.95" font-family="Times New Roman,serif" font-size="14.00">And the next day, that photo is everywhere. Everyone on campus has seen it. Shared. Sent it to your PROFESSORS. All over the INTERNET. Countries I didn&#39;t even know existed.</text>
