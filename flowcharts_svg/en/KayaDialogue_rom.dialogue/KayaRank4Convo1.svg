<text xml:space="preserve" text-anchor="middle" x="530.38" y="-300.95" font-family="Times New Roman,serif" font-size="14.00">But to me it ruined my life. I want to live in a future with no internet. I want to prove that I can move forward from this. Going to the past proves THEM right, that I can&#39;t move on from this.</text>
