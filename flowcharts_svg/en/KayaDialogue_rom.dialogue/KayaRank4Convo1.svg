<text xml:space="preserve" text-anchor="middle" x="530.38" y="-372.95" font-family="Times New Roman,serif" font-size="14.00">So when I say I&#39;m going to get out of here, I mean it. I know that picture means NOTHING, the future moved on, people got their kicks.</text>
