<text xml:space="preserve" text-anchor="middle" x="530.38" y="-588.95" font-family="Times New Roman,serif" font-size="14.00">So you send a nude picture of yourself that would make Lua blush. You think you have a connection with someone you met on the internet. You can trust your online boyfriend. </text>
