<text text-anchor="middle" x="684" y="-590.3" font-family="Times New Roman,serif" font-size="14.00">It feels oft as though I am an empty scrap of canvas, smearing oil paints upon its surface &#45; uselessly attempting create a shadow of an image that I can see in my mind&#39;s eye.</text>
