<polygon fill="none" stroke="blue" points="975.88,-416.5 50.12,-416.5 50.12,-380.5 975.88,-380.5 975.88,-416.5"/>
<text xml:space="preserve" text-anchor="middle" x="513" y="-393.45" font-family="Times New Roman,serif" font-size="14.00">Maryna. You gave me your body. Together, in that trench, we drank Kuva. My hands shook and my gashed throat leaked, but I kept enough drops down for it to take.</text>
</g>
<!-- j790838256&#45;&gt;j3925962211 -->
<g id="edge8" class="edge">
