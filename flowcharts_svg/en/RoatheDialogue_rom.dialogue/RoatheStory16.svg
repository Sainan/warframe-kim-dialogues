<polygon fill="none" stroke="blue" points="780.12,-489.5 245.88,-489.5 245.88,-453.5 780.12,-453.5 780.12,-489.5"/>
<text xml:space="preserve" text-anchor="middle" x="513" y="-466.45" font-family="Times New Roman,serif" font-size="14.00">You laid down your life for your superior officer. I felt your selflessness like a slap in the face.</text>
</g>
