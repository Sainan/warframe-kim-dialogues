<text xml:space="preserve" text-anchor="middle" x="513" y="-231.95" font-family="Times New Roman,serif" font-size="14.00">Rostig. Something wrong in the cloning process, they said. What else could make a Grineer stay at his turret while burning alive? Even a rat understands self&#45;preservation!</text>
