<g id="node9" class="node">
<title>j3006621707</title>
<polygon fill="none" stroke="blue" points="890,-328 136,-328 136,-292 890,-292 890,-328"/>
<text xml:space="preserve" text-anchor="middle" x="513" y="-304.95" font-family="Times New Roman,serif" font-size="14.00">I remember your last salute. The fading. Then I blinked open the eyes that had been yours, and saw my gutted corpse dead in the mud.</text>
</g>
