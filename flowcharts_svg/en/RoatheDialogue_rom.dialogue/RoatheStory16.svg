<g id="node9" class="node">
<title>j3006621707</title>
<polygon fill="none" stroke="blue" points="905,-328 137,-328 137,-292 905,-292 905,-328"/>
<text text-anchor="middle" x="521" y="-306.3" font-family="Times New Roman,serif" font-size="14.00">I remember your last salute. The fading. Then I blinked open the eyes that had been yours, and saw my gutted corpse dead in the mud.</text>
</g>
