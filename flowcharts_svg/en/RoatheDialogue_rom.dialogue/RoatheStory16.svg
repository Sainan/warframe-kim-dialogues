<polygon fill="none" stroke="blue" points="997.62,-562.5 28.37,-562.5 28.37,-526.5 997.62,-526.5 997.62,-562.5"/>
<text xml:space="preserve" text-anchor="middle" x="513" y="-539.45" font-family="Times New Roman,serif" font-size="14.00">Transcript: Traivon. I watched you hurl your Railjack into Praghasa’s maw. Distracted, feeding greedily on you and your men, she never noticed my own ship speeding away.</text>
</g>
