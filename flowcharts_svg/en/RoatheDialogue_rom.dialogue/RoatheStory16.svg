<polygon fill="none" stroke="blue" points="995,-415 47,-415 47,-379 995,-379 995,-415"/>
<text text-anchor="middle" x="521" y="-393.3" font-family="Times New Roman,serif" font-size="14.00">Maryna. You gave me your body. Together, in that trench, we drank Kuva. My hands shook and my gashed throat leaked, but I kept enough drops down for it to take.</text>
</g>
