<polygon fill="none" stroke="blue" points="1129.62,-328 124.38,-328 124.38,-292 1129.62,-292 1129.62,-328"/>
<text xml:space="preserve" text-anchor="middle" x="627" y="-304.95" font-family="Times New Roman,serif" font-size="14.00">It was insanity. How could I strategize around the behaviour of Sentient crab&#45;ships, when no sooner had my tactics been perfected than the crab&#45;ships were replaced by worm&#45;ships?</text>
</g>
