<text xml:space="preserve" text-anchor="middle" x="627" y="-466.45" font-family="Times New Roman,serif" font-size="14.00">Transcript: Many of the Sentients evolved between encounters, so we could never be sure that we would face the same foe twice. But others remained in consistent form, as if they had reached some plateau long ago.</text>
