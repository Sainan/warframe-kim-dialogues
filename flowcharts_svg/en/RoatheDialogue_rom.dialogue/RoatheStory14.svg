<title>j1227207314</title>
<polygon fill="none" stroke="blue" points="1151.5,-328 122.5,-328 122.5,-292 1151.5,-292 1151.5,-328"/>
<text text-anchor="middle" x="637" y="-306.3" font-family="Times New Roman,serif" font-size="14.00">It was insanity. How could I strategize around the behaviour of Sentient crab&#45;ships, when no sooner had my tactics been perfected than the crab&#45;ships were replaced by worm&#45;ships?</text>
</g>
