<text xml:space="preserve" text-anchor="middle" x="533.71" y="-612.45" font-family="Times New Roman,serif" font-size="14.00">Transcript: I understood from the start &#45; both on the battlefield and in the bedchamber &#45; the path to victory through seeming submission.</text>
