<text xml:space="preserve" text-anchor="middle" x="533.71" y="-377.95" font-family="Times New Roman,serif" font-size="14.00">Roathe the bloody&#45;handed. Roathe the ogre fattened on the bodies of his men. Spendthrift of lives.</text>
</g>
