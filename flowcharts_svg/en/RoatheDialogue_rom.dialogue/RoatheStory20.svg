<polygon fill="none" stroke="blue" points="829.71,-562.5 237.71,-562.5 237.71,-526.5 829.71,-526.5 829.71,-562.5"/>
<text xml:space="preserve" text-anchor="middle" x="533.71" y="-539.45" font-family="Times New Roman,serif" font-size="14.00">Where the enemy finds you yielding, there you can be sure he will push; and so you may easily trip him.</text>
