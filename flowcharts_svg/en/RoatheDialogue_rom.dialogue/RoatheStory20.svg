<text xml:space="preserve" text-anchor="middle" x="533.71" y="-231.95" font-family="Times New Roman,serif" font-size="14.00">For that to happen, the war must continue. Only defeat, absolute and irrevocable, would topple those seven golden gargoyles.</text>
