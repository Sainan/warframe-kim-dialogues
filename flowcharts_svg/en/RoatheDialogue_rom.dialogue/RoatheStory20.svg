<polygon fill="none" stroke="blue" points="808.33,-489.5 259.08,-489.5 259.08,-453.5 808.33,-453.5 808.33,-489.5"/>
<text xml:space="preserve" text-anchor="middle" x="533.71" y="-466.45" font-family="Times New Roman,serif" font-size="14.00">“Lackey,” they called me. “Lapdog.” Nitokh thought herself in control. How subtly I guided her. </text>
</g>
