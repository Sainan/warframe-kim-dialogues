<polygon fill="none" stroke="blue" points="943.88,-489.5 36.12,-489.5 36.12,-453.5 943.88,-453.5 943.88,-489.5"/>
<text xml:space="preserve" text-anchor="middle" x="490" y="-466.45" font-family="Times New Roman,serif" font-size="14.00">The war was all but lost; the Sentients were unvanquishable; let us, then, create these strange and surreal warriors and arm them with weapons of ancient pedigree.</text>
