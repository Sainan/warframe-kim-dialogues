<text xml:space="preserve" text-anchor="middle" x="517" y="-231.95" font-family="Times New Roman,serif" font-size="14.00">Eternal. Limitless in her hunger. She summoned me to her bath one evening. I strode across the mingling puddles of perfumed water and blood and stood dutifully to attention.</text>
