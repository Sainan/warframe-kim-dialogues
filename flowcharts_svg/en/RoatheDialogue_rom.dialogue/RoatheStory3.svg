<text xml:space="preserve" text-anchor="middle" x="498" y="-393.45" font-family="Times New Roman,serif" font-size="14.00">Transcript: For so long the Orokin Empire had no enemies. Its military existed merely to pursue petty grudges, house against house, Executor against Executor.</text>
