<text xml:space="preserve" text-anchor="middle" x="498" y="-320.45" font-family="Times New Roman,serif" font-size="14.00">When the Sentients attacked, we knew a unity long denied to us. The Dax drew their swords against something other than an insolent peasant or a larcenous trader.</text>
