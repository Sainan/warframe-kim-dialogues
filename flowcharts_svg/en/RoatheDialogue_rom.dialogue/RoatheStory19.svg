<text xml:space="preserve" text-anchor="middle" x="527.71" y="-231.95" font-family="Times New Roman,serif" font-size="14.00">For reasons I cannot guess, he chose peace; it was four to three, and so the ravening Sentients were suddenly allies and friends.</text>
