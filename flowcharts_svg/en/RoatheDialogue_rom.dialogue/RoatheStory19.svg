<text xml:space="preserve" text-anchor="middle" x="527.71" y="-539.45" font-family="Times New Roman,serif" font-size="14.00">Ever the diplomat, ever the honey&#45;voiced persuader, he resolved the grudges and disputes of the others.</text>
