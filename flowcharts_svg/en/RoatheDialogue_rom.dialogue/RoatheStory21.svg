<polygon fill="none" stroke="blue" points="1092.88,-635.5 95.12,-635.5 95.12,-599.5 1092.88,-599.5 1092.88,-635.5"/>
<text xml:space="preserve" text-anchor="middle" x="594" y="-612.45" font-family="Times New Roman,serif" font-size="14.00">I remember now. He approached me, in the Golden Halls. He wore a face I did not know. But that is not so very unusual for our kind. I knew his voice. I knew the way he moved.</text>
</g>
