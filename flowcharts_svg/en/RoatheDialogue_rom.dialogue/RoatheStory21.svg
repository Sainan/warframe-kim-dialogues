<polygon fill="none" stroke="blue" points="1160,-781.5 28,-781.5 28,-745.5 1160,-745.5 1160,-781.5"/>
<text xml:space="preserve" text-anchor="middle" x="594" y="-758.45" font-family="Times New Roman,serif" font-size="14.00">That is what they called me, isn’t it? I’ve read the history books scattered about this dusty hall. A lie. They did not know the truth. That I was ripped away from my time before I could complete my work.</text>
