<text xml:space="preserve" text-anchor="middle" x="619" y="-158.95" font-family="Times New Roman,serif" font-size="14.00">The flock of wicked little leveller&#45;drones we sent out came winging merrily back to us still heavy with bombs, chortling in unknown syllables, detonating in the midst of the very motherships that dispatched them.</text>
