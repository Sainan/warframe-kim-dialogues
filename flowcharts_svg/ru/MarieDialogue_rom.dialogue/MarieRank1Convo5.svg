<g id="node4" class="node">
<title>j2186130974</title>
<polygon fill="none" stroke="blue" points="1278,-756 86,-756 86,-720 1278,-720 1278,-756"/>
<text text-anchor="middle" x="682" y="-734.3" font-family="Times New Roman,serif" font-size="14.00">I am Sœur Marie Leroux, but you may call me Marie. I have recently come here with the brother of my soul, Father Lyon Allard and... well, I think Monsieur Loid may have warned you of the devil, n&#39;est&#45;ce pas ?</text>
</g>
<!-- j1232032049&#45;&gt;j2186130974 -->
