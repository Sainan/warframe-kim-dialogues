<text xml:space="preserve" text-anchor="middle" x="662.38" y="-876.95" font-family="Times New Roman,serif" font-size="14.00">Bonjour, bonjour! Вы, должно быть, Скиталец, да? Monsieur Лойд так много мне о вас рассказывал. Я так рада нашей «встрече» здесь...</text>
