<text text-anchor="middle" x="682" y="-662.3" font-family="Times New Roman,serif" font-size="14.00">It&#39;s lovely to meet you. And don&#39;t take this the wrong way, you&#39;re welcome here, but... what are you all doing here?</text>
</g>
