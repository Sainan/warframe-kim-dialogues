<text text-anchor="middle" x="1380" y="-374.3" font-family="Times New Roman,serif" font-size="14.00">Мы должны сделать всё возможное, чтобы направить его душу на правильный путь, si c’est possible. Et si ce n’est pas le cas? Тогда мы должны по крайней мере позаботиться о том, чтобы он больше не причинял вреда.</text>
