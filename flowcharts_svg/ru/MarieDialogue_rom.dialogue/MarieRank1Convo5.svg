<text text-anchor="middle" x="1919" y="-518.3" font-family="Times New Roman,serif" font-size="14.00">Да, это чудовище, à la peau bleue, доверенное нам le Cardinal. Полагаю, ты знаешь его как Альбрехта Энтрати? Он — причина, по которой мы здесь. Но это очень долгая история, j’en ai bien peur.</text>
</g>
