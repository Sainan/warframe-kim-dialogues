<!-- j712118698 -->
<g id="node2" class="node">
<title>j712118698</title>
<polygon fill="none" stroke="blue" points="1101.5,-900 262.5,-900 262.5,-864 1101.5,-864 1101.5,-900"/>
<text text-anchor="middle" x="682" y="-878.3" font-family="Times New Roman,serif" font-size="14.00">Bonjour, bonjour! Вы, должно быть, Скиталец, да? Monsieur Лойд так много мне о вас рассказывал. Я так рада нашей «встрече» здесь...</text>
</g>
