<text xml:space="preserve" text-anchor="middle" x="662.38" y="-516.95" font-family="Times New Roman,serif" font-size="14.00">Спасибо! Что и как привело нас сюда — очень долгая история, j’en ai bien peur. Нас послал сюда le Cardinal. Полагаю, ты знаешь его как Альбрехта Энтрати? Он доверил нам этого синекожего monstre irritant.</text>
