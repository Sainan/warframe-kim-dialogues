<!-- j3187048200 -->
<g id="node4" class="node">
<title>j3187048200</title>
<polygon fill="none" stroke="blue" points="1364,-756 0,-756 0,-720 1364,-720 1364,-756"/>
<text text-anchor="middle" x="682" y="-734.3" font-family="Times New Roman,serif" font-size="14.00">Меня зовут сестра Мари Леру, но ты можешь называть меня Мари. Недавно я приехала сюда с братом моей души, отцом Лионом Аллардом, и… ну, думаю, Monsieur Лойд, возможно, говорил тебе о дьяволе, n’est&#45;ce pas?</text>
</g>
