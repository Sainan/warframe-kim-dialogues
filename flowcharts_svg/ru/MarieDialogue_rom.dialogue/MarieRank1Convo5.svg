<text xml:space="preserve" text-anchor="middle" x="662.38" y="-660.95" font-family="Times New Roman,serif" font-size="14.00">Приятно познакомиться. И не поймите неправильно, вам здесь рады, но... что вы все здесь делаете?</text>
