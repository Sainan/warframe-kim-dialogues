<polygon fill="none" stroke="blue" points="1324.75,-756 0,-756 0,-720 1324.75,-720 1324.75,-756"/>
<text xml:space="preserve" text-anchor="middle" x="662.38" y="-732.95" font-family="Times New Roman,serif" font-size="14.00">Меня зовут сестра Мари Леру, но ты можешь называть меня Мари. Недавно я приехала сюда с братом моей души, отцом Лионом Аллардом, и… ну, думаю, Monsieur Лойд, возможно, говорил тебе о дьяволе, n’est&#45;ce pas?</text>
</g>
