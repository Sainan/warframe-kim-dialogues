<text text-anchor="middle" x="1208" y="-699.3" font-family="Times New Roman,serif" font-size="14.00">Я просто хотела сказать, что... Я знаю, что твоё сердце принадлежит и другому человеку. И хотя я не знаю их, моё сердце радуется этому.</text>
