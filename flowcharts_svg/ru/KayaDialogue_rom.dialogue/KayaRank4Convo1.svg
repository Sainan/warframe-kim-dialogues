<text text-anchor="middle" x="668" y="-302.3" font-family="Times New Roman,serif" font-size="14.00">Но для меня это разрушило мою жизнь. Я хочу жить в будущем без интернета. Я хочу доказать, что могу двинуться дальше. Возвращение в прошлое доказывает ИХ правоту, что я не могу двигаться дальше из этого.</text>
