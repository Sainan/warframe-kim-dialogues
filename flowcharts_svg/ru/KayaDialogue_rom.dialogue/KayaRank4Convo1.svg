<text text-anchor="middle" x="668" y="-518.3" font-family="Times New Roman,serif" font-size="14.00">А на следующий день это фото повсюду. Весь кампус его видел. Разослали. Отправили твоим ПРОФЕССОРАМ. Весь ИНТЕРНЕТ. Страны, о существовании которых я даже не знала.</text>
