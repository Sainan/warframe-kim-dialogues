<text text-anchor="middle" x="668" y="-590.3" font-family="Times New Roman,serif" font-size="14.00">Так что ты отправляешь откровенное фото, от которого даже Луа покраснела бы. Думаешь, у тебя есть связь с кем&#45;то, кого встретила онлайн. Думаешь, можешь доверять своему интернет&#45;парню. </text>
