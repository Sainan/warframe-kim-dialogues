<text text-anchor="middle" x="668" y="-374.3" font-family="Times New Roman,serif" font-size="14.00">Так что когда я говорю, что собираюсь выбраться отсюда, я не шучу. Я знаю, что это фото НИЧЕГО не значит, мир двинулся дальше, люди получили свои развлечения.</text>
