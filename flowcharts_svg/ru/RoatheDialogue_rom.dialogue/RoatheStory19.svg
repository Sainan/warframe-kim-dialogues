<text text-anchor="middle" x="604" y="-233.3" font-family="Times New Roman,serif" font-size="14.00">По причинам, которые я не могу предположить, он выбрал мир; счет был четыре к трем, и поэтому кровожадные Владеющие Разумом существа внезапно стали союзниками и друзьями.</text>
