<text text-anchor="middle" x="632" y="-233.3" font-family="Times New Roman,serif" font-size="14.00">Вечная. Безграничная в своём голоде. Однажды вечером она призвала меня к своей купели. Я шагал по смешавшимся лужам ароматной воды и крови и встал по стойке смирно, как и полагалось.</text>
