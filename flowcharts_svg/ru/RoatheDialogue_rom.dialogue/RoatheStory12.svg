<text text-anchor="middle" x="822" y="-466.3" font-family="Times New Roman,serif" font-size="14.00">Стенограмма: Чудовищность и излишества в прошлом служили нам верой и правдой. От меня ожидали, что я буду применять их в качестве военной тактики.</text>
</g>
