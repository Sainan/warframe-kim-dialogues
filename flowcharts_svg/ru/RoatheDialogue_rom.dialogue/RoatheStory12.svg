<text text-anchor="middle" x="822" y="-306.3" font-family="Times New Roman,serif" font-size="14.00">Все Семь повелели мне, как единому целому, превратиться в Дьявола с трезубцем, полным боеголовок, и в сеятеля с мешком, наполненным безудержным излучением.</text>
</g>
