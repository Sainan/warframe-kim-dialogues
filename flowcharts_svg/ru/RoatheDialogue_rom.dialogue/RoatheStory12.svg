<text text-anchor="middle" x="822" y="-233.3" font-family="Times New Roman,serif" font-size="14.00">В тот день мы поняли, что Владеющие Разумом способны не только сводить на нет наши технологии, но и захватывать их под свой контроль.</text>
</g>
