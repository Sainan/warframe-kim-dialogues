<text text-anchor="middle" x="822" y="-160.3" font-family="Times New Roman,serif" font-size="14.00">Стая злобных крошечных дронов нивелировщиков, которых мы отправили вперёд, весело вернулась к нам, всё ещё нагруженная бомбами, похрюкивая на неизвестных слогах и взрываясь прямо в чреве тех самых материнских кораблей, что их и выпустили.</text>
