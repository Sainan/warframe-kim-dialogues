<polygon fill="none" stroke="blue" points="877,-401 109,-401 109,-365 877,-365 877,-401"/>
<text text-anchor="middle" x="493" y="-379.3" font-family="Times New Roman,serif" font-size="14.00">I remember your last salute. The fading. Then I blinked open the eyes that had been yours, and saw my gutted corpse dead in the mud.</text>
