<!-- j2590487634 -->
<g id="node9" class="node">
<title>j2590487634</title>
<polygon fill="none" stroke="blue" points="1072,-328 304,-328 304,-292 1072,-292 1072,-328"/>
<text text-anchor="middle" x="688" y="-306.3" font-family="Times New Roman,serif" font-size="14.00">I remember your last salute. The fading. Then I blinked open the eyes that had been yours, and saw my gutted corpse dead in the mud.</text>
</g>
