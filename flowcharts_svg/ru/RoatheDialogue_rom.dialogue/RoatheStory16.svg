<!-- j1675612349 -->
<g id="node7" class="node">
<title>j1675612349</title>
<polygon fill="none" stroke="blue" points="959,-488 417,-488 417,-452 959,-452 959,-488"/>
<text text-anchor="middle" x="688" y="-466.3" font-family="Times New Roman,serif" font-size="14.00">You laid down your life for your superior officer. I felt your selflessness like a slap in the face.</text>
</g>
<!-- j3142210953&#45;&gt;j1675612349 -->
<g id="edge7" class="edge">
<title>j3142210953&#45;&gt;j1675612349</title>
