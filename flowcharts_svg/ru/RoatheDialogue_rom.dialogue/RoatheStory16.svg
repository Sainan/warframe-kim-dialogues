<text text-anchor="middle" x="493" y="-598.3" font-family="Times New Roman,serif" font-size="14.00">Transcript: Traivon. I watched you hurl your Railjack into Praghasa’s maw. Distracted, feeding greedily on you and your men, she never noticed my own ship speeding away.</text>
