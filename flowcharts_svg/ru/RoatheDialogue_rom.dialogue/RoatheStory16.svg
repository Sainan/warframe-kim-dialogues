<!-- j3128607985 -->
<g id="node8" class="node">
<title>j3128607985</title>
<polygon fill="none" stroke="blue" points="1162,-415 214,-415 214,-379 1162,-379 1162,-415"/>
<text text-anchor="middle" x="688" y="-393.3" font-family="Times New Roman,serif" font-size="14.00">Maryna. You gave me your body. Together, in that trench, we drank Kuva. My hands shook and my gashed throat leaked, but I kept enough drops down for it to take.</text>
</g>
<!-- j1675612349&#45;&gt;j3128607985 -->
<g id="edge8" class="edge">
<title>j1675612349&#45;&gt;j3128607985</title>
<path fill="none" stroke="black" d="M688,-451.81C688,-444.23 688,-435.1 688,-426.54"/>
