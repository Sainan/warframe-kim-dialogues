<text text-anchor="middle" x="688" y="-539.3" font-family="Times New Roman,serif" font-size="14.00">Стенограмма: Трейвон. Я видел, как ты швырнул свой Рэйлджек прямо в пасть Прагасы. Отвлечённая, жадно пожиравшая тебя и твоих людей, она так и не заметила, как мой собственный корабль уносился прочь.</text>
</g>
