<text xml:space="preserve" text-anchor="middle" x="671" y="-539.45" font-family="Times New Roman,serif" font-size="14.00">Стенограмма: Трейвон. Я видел, как ты швырнул свой Рэйлджек прямо в пасть Прагасы. Отвлечённая, жадно пожиравшая тебя и твоих людей, она так и не заметила, как мой собственный корабль уносился прочь.</text>
