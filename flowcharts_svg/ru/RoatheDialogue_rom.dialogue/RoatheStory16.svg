<text xml:space="preserve" text-anchor="middle" x="671" y="-304.95" font-family="Times New Roman,serif" font-size="14.00">Я помню твой последний жест прощания. Угасание. Потом я моргнул и открыл глаза, когда&#45;то принадлежавшие тебе, и увидел мой собственный выпотрошенный труп, безжизненно лежащее в грязи.</text>
