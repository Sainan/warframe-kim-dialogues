<g id="node8" class="node">
<title>j4159373758</title>
<polygon fill="none" stroke="blue" points="1253,-415 123,-415 123,-379 1253,-379 1253,-415"/>
<text text-anchor="middle" x="688" y="-393.3" font-family="Times New Roman,serif" font-size="14.00">Марина. Ты отдала мне своё тело. Там, в той траншее, мы пили Куву. Мои руки дрожали, горло было рассечено и сочилось, но я проглотил достаточно капель, чтобы она сработала.</text>
</g>
