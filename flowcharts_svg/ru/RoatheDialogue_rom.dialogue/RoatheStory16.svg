<polygon fill="none" stroke="blue" points="1292.5,-255 83.5,-255 83.5,-219 1292.5,-219 1292.5,-255"/>
<text text-anchor="middle" x="688" y="-233.3" font-family="Times New Roman,serif" font-size="14.00">Ростиг. Что&#45;то пошло не так в процессе клонирования, говорили они. Что ещё могло заставить Гринира оставаться у своей турели, горя живьём? Даже крыса понимает инстинкт самосохранения!</text>
</g>
