<polygon fill="none" stroke="blue" points="967,-474 19,-474 19,-438 967,-438 967,-474"/>
<text text-anchor="middle" x="493" y="-452.3" font-family="Times New Roman,serif" font-size="14.00">Maryna. You gave me your body. Together, in that trench, we drank Kuva. My hands shook and my gashed throat leaked, but I kept enough drops down for it to take.</text>
</g>
