<polygon fill="none" stroke="blue" points="1304.5,-328 71.5,-328 71.5,-292 1304.5,-292 1304.5,-328"/>
<text text-anchor="middle" x="688" y="-306.3" font-family="Times New Roman,serif" font-size="14.00">Я помню твой последний жест прощания. Угасание. Потом я моргнул и открыл глаза, когда&#45;то принадлежавшие тебе, и увидел мой собственный выпотрошенный труп, безжизненно лежащее в грязи.</text>
</g>
