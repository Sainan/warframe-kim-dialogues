<text text-anchor="middle" x="688" y="-466.3" font-family="Times New Roman,serif" font-size="14.00">Ты отдал свою жизнь за своего вышестоящего офицера. Я воспринял твою самоотверженность, словно пощёчину.</text>
</g>
