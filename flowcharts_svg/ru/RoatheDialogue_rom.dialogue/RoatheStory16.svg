<text xml:space="preserve" text-anchor="middle" x="671" y="-393.45" font-family="Times New Roman,serif" font-size="14.00">Марина. Ты отдала мне своё тело. Там, в той траншее, мы пили Куву. Мои руки дрожали, горло было рассечено и сочилось, но я проглотил достаточно капель, чтобы она сработала.</text>
</g>
