<text text-anchor="middle" x="604" y="-612.3" font-family="Times New Roman,serif" font-size="14.00">I remember now. He approached me, in the Golden Halls. He wore a face I did not know. But that is not so very unusual for our kind. I knew his voice. I knew the way he moved.</text>
</g>
