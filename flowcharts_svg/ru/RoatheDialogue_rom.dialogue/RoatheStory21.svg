<text xml:space="preserve" text-anchor="middle" x="666" y="-758.45" font-family="Times New Roman,serif" font-size="14.00">Так они меня называли, не так ли? Я читал книги по истории, разбросанные по этому пыльному залу. Ложь. Они не знали правды. Что меня вырвали из моего времени, прежде чем я смог завершить свою работу.</text>
