<text text-anchor="middle" x="438" y="-612.3" font-family="Times New Roman,serif" font-size="14.00">Стенограмма: Я понимал с самого начала &#45; и на поле боя, и в опочивальне &#45; что путь к победе лежит через кажущуюся покорность.</text>
</g>
