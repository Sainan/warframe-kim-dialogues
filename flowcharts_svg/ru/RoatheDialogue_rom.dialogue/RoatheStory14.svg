<polygon fill="none" stroke="blue" points="1635.5,-488 28.5,-488 28.5,-452 1635.5,-452 1635.5,-488"/>
<text text-anchor="middle" x="832" y="-466.3" font-family="Times New Roman,serif" font-size="14.00">Стенограмма: Многие Владеющие Разумом эволюционировали между столкновениями, так что мы никогда не могли быть уверены, что встретим одного и того же врага дважды. Но другие сохраняли неизменную форму, словно давно достигли своего предела.</text>
</g>
