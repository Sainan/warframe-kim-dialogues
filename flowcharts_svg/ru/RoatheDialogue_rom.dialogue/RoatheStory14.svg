<text text-anchor="middle" x="832" y="-306.3" font-family="Times New Roman,serif" font-size="14.00">Это было безумием. Как можно выстраивать стратегию против поведения Владеющих Разумом кораблей‑крабов, если стоило лишь отточить тактику, как их тут же сменяли корабли‑черви?</text>
