<text text-anchor="middle" x="670" y="-140.8" font-family="Times New Roman,serif" font-size="14.00">นั่นแหละ สาเหตุที่ทำไมถึงเลี้ยงหนูไว้แต่แรก&#13;</text>
<text text-anchor="middle" x="670" y="-125.8" font-family="Times New Roman,serif" font-size="14.00">ชีวิตพวกมันสั้น แต่ก็ไม่เคยลืมที่จะใช้ชีวิตให้คุ้ม&#13;</text>
<text text-anchor="middle" x="670" y="-110.8" font-family="Times New Roman,serif" font-size="14.00">หาความสุขในทุกเศษขนมปังที่หาได้&#13;</text>
<text text-anchor="middle" x="670" y="-95.8" font-family="Times New Roman,serif" font-size="14.00">แล้วตอบแทนความรักทั้งหมดที่มีให้&#13;</text>
<text text-anchor="middle" x="670" y="-80.8" font-family="Times New Roman,serif" font-size="14.00">เพราะไม่รู้หรอกว่าจะจากกันไปเมื่อใด</text>
