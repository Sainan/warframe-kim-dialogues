<text xml:space="preserve" text-anchor="middle" x="706.25" y="-660.95" font-family="Times New Roman,serif" font-size="14.00">I do not know how to describe it &#45; save for that it is... like I am grasping for something, only to see bits of dust slip through my fingers. </text>
</g>
