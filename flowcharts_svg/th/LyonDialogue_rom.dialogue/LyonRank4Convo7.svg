<text xml:space="preserve" text-anchor="middle" x="706.25" y="-732.95" font-family="Times New Roman,serif" font-size="14.00">Conversations are difficult for me. Far more so in intimate engagements than they are in these kinds of impersonal, mechanical ones or by post.</text>
