<polygon fill="none" stroke="blue" points="1187.5,-612 225,-612 225,-576 1187.5,-576 1187.5,-612"/>
<text xml:space="preserve" text-anchor="middle" x="706.25" y="-588.95" font-family="Times New Roman,serif" font-size="14.00">It feels oft as though I am an empty scrap of canvas, smearing oil paints upon its surface &#45; uselessly attempting create a shadow of an image that I can see in my mind&#39;s eye.</text>
</g>
