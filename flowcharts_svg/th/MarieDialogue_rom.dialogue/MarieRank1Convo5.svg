<text text-anchor="middle" x="2900.5" y="-518.3" font-family="Times New Roman,serif" font-size="14.00">Oui, เราได้รับความไว้วางใจจาก le Cardinal ที่ฝาก ce monstre irritant à la peau bleue ไว้กับเรา ฉันคิดว่าคุณรู้จักเขาในชื่อ Albrecht Entrati ? เขาเป็นเหตุผลที่เรามาอยู่ที่นี่ แต่นั่นเป็นเรื่องยาวมาก j&#39;en ai bien peur</text>
