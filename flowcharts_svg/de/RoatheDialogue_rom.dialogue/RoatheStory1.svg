<text text-anchor="middle" x="565" y="-233.3" font-family="Times New Roman,serif" font-size="14.00">Ewig. Unstillbar in ihrem Hunger. Eines Abends rief sie mich zu ihrem Bad. Ich schritt durch die sich vermischenden Pfützen aus duftendem Wasser und Blut und stand pflichtbewusst bereit.</text>
</g>
