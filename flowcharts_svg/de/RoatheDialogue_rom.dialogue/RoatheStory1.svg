<text text-anchor="middle" x="565" y="-379.3" font-family="Times New Roman,serif" font-size="14.00">Durch ihre wahnsinnigen Visionen konnte ich der langen, trostlosen Stagnation des Daseins der Orokin entfliehen.</text>
