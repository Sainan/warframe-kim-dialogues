<text xml:space="preserve" text-anchor="middle" x="558" y="-377.95" font-family="Times New Roman,serif" font-size="14.00">Durch ihre wahnsinnigen Visionen konnte ich der langen, trostlosen Stagnation des Daseins der Orokin entfliehen.</text>
