<text xml:space="preserve" text-anchor="middle" x="558" y="-231.95" font-family="Times New Roman,serif" font-size="14.00">Ewig. Unstillbar in ihrem Hunger. Eines Abends rief sie mich zu ihrem Bad. Ich schritt durch die sich vermischenden Pfützen aus duftendem Wasser und Blut und stand pflichtbewusst bereit.</text>
</g>
