<text text-anchor="middle" x="634" y="-233.3" font-family="Times New Roman,serif" font-size="14.00">Rostig. Etwas sei beim Klonen schiefgelaufen, sagten sie. Was sonst könnte einen Grineer dazu bringen, bei lebendigem Leibe in seinem Geschützturm zu verharren? Selbst eine Ratte versteht Selbsterhaltung!</text>
