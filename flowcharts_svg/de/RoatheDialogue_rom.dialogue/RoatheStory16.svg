<text xml:space="preserve" text-anchor="middle" x="631" y="-539.45" font-family="Times New Roman,serif" font-size="14.00">Transkript: Traivon. Ich sah, wie du deinen Railjack in Praghasas Rachen schleudertest. Abgelenkt nährte sie sich an dir und deinen Männern, ohne zu bemerken, wie mein Schiff davonraste.</text>
