<text text-anchor="middle" x="634" y="-466.3" font-family="Times New Roman,serif" font-size="14.00">Du gabst dein Leben für deinen Vorgesetzten. Deine Selbstlosigkeit traf mich wie ein Schlag ins Gesicht.</text>
</g>
