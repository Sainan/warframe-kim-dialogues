<g id="node6" class="node">
<title>j3407520145</title>
<polygon fill="none" stroke="blue" points="1169,-561 99,-561 99,-525 1169,-525 1169,-561"/>
<text text-anchor="middle" x="634" y="-539.3" font-family="Times New Roman,serif" font-size="14.00">Transkript: Traivon. Ich sah, wie du deinen Railjack in Praghasas Rachen schleudertest. Abgelenkt nährte sie sich an dir und deinen Männern, ohne zu bemerken, wie mein Schiff davonraste.</text>
</g>
