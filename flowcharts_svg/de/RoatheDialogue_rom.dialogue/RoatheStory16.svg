<g id="node9" class="node">
<title>j2425958968</title>
<polygon fill="none" stroke="blue" points="1126,-328 142,-328 142,-292 1126,-292 1126,-328"/>
<text text-anchor="middle" x="634" y="-306.3" font-family="Times New Roman,serif" font-size="14.00">Ich erinnere mich an deinen letzten Salut. Das Verblassen. Dann öffnete ich die Augen, die einst deine gewesen waren, und sah meinen ausgeweideten Körper tot im Schlamm.</text>
</g>
