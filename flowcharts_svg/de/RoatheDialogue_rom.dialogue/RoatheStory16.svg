<text xml:space="preserve" text-anchor="middle" x="631" y="-393.45" font-family="Times New Roman,serif" font-size="14.00">Maryna. Du gabst mir deinen Körper. Gemeinsam tranken wir in diesem Graben Kuva. Meine Hände zitterten, und aus meiner aufgeschlitzten Kehle sickerte Flüssigkeit, aber ich konnte genug Tropfen hinunterspülen.</text>
</g>
