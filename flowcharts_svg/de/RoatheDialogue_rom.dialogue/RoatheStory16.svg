<text text-anchor="middle" x="605.5" y="-452.3" font-family="Times New Roman,serif" font-size="14.00">Maryna. Du gabst mir deinen Körper. Gemeinsam tranken wir in diesem Graben Kuva. Meine Hände zitterten, und aus meiner aufgeschlitzten Kehle sickerte Flüssigkeit, aber ich konnte genug Tropfen hinunterspülen.</text>
