<text xml:space="preserve" text-anchor="middle" x="631" y="-304.95" font-family="Times New Roman,serif" font-size="14.00">Ich erinnere mich an deinen letzten Salut. Das Verblassen. Dann öffnete ich die Augen, die einst deine gewesen waren, und sah meinen ausgeweideten Körper tot im Schlamm.</text>
