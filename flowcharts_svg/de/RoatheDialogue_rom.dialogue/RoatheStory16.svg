<polygon fill="none" stroke="blue" points="1239.5,-415 28.5,-415 28.5,-379 1239.5,-379 1239.5,-415"/>
<text text-anchor="middle" x="634" y="-393.3" font-family="Times New Roman,serif" font-size="14.00">Maryna. Du gabst mir deinen Körper. Gemeinsam tranken wir in diesem Graben Kuva. Meine Hände zitterten, und aus meiner aufgeschlitzten Kehle sickerte Flüssigkeit, aber ich konnte genug Tropfen hinunterspülen.</text>
</g>
