<text xml:space="preserve" text-anchor="middle" x="736" y="-304.95" font-family="Times New Roman,serif" font-size="14.00">Es war Wahnsinn. Wie sollte ich Strategien für das Verhalten der Sentient Krabbenschiffe entwickeln, wenn die Krabbenschiffe durch Wurmschiffe ersetzt wurden, kaum dass meine Taktiken perfektioniert waren?</text>
