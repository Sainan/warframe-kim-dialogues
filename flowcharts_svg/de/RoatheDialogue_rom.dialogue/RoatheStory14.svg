<text text-anchor="middle" x="741" y="-466.3" font-family="Times New Roman,serif" font-size="14.00">Transkript: Viele der Sentients entwickelten sich zwischen den Begegnungen weiter, sodass wir nie sicher sein konnten, demselben Feind zweimal gegenüberzustehen. Andere hingegen blieben unverändert, als hätten sie vor langer Zeit eine Grenze erreicht.</text>
</g>
