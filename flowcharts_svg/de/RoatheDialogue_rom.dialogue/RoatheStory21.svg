<g id="node9" class="node">
<title>j248444329</title>
<polygon fill="none" stroke="blue" points="1302,-634 120,-634 120,-598 1302,-598 1302,-634"/>
<text text-anchor="middle" x="711" y="-612.3" font-family="Times New Roman,serif" font-size="14.00">Jetzt erinnere ich mich. Er näherte sich mir in den Goldenen Hallen. Ein mir unbekanntes Gesicht. Aber das ist nicht so ungewöhnlich für unseresgleichen. Ich kannte seine Stimme. Ich kannte seine Bewegungen.</text>
</g>
