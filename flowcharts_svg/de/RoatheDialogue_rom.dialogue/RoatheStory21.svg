<text text-anchor="middle" x="682.5" y="-671.3" font-family="Times New Roman,serif" font-size="14.00">Jetzt erinnere ich mich. Er näherte sich mir in den Goldenen Hallen. Ein mir unbekanntes Gesicht. Aber das ist nicht so ungewöhnlich für unseresgleichen. Ich kannte seine Stimme. Ich kannte seine Bewegungen.</text>
