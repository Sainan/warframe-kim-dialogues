<!-- j3111563355 -->
<g id="node7" class="node">
<title>j3111563355</title>
<polygon fill="none" stroke="blue" points="1393.5,-780 28.5,-780 28.5,-744 1393.5,-744 1393.5,-780"/>
<text text-anchor="middle" x="711" y="-758.3" font-family="Times New Roman,serif" font-size="14.00">So nannten sie mich, nicht wahr? Ich habe die Geschichtsbücher gelesen, die in dieser staubigen Halle verstreut liegen. Eine Lüge. Sie kannten die Wahrheit nicht. Dass ich aus meiner Zeit gerissen wurde, bevor ich mein Werk vollenden konnte.</text>
</g>
