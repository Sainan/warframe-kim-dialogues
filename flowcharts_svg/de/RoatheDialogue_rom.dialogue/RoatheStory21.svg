<title>5725</title>
<polygon fill="none" stroke="blue" points="1365,-839 0,-839 0,-803 1365,-803 1365,-839"/>
<text text-anchor="middle" x="682.5" y="-817.3" font-family="Times New Roman,serif" font-size="14.00">So nannten sie mich, nicht wahr? Ich habe die Geschichtsbücher gelesen, die in dieser staubigen Halle verstreut liegen. Eine Lüge. Sie kannten die Wahrheit nicht. Dass ich aus meiner Zeit gerissen wurde, bevor ich mein Werk vollenden konnte.</text>
