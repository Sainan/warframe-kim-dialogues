<polygon fill="none" stroke="blue" points="1382,-781.5 28,-781.5 28,-745.5 1382,-745.5 1382,-781.5"/>
<text xml:space="preserve" text-anchor="middle" x="705" y="-758.45" font-family="Times New Roman,serif" font-size="14.00">So nannten sie mich, nicht wahr? Ich habe die Geschichtsbücher gelesen, die in dieser staubigen Halle verstreut liegen. Eine Lüge. Sie kannten die Wahrheit nicht. Dass ich aus meiner Zeit gerissen wurde, bevor ich mein Werk vollenden konnte.</text>
</g>
