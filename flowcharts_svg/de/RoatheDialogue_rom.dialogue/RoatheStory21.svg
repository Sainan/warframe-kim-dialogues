<polygon fill="none" stroke="blue" points="1293.88,-635.5 116.12,-635.5 116.12,-599.5 1293.88,-599.5 1293.88,-635.5"/>
<text xml:space="preserve" text-anchor="middle" x="705" y="-612.45" font-family="Times New Roman,serif" font-size="14.00">Jetzt erinnere ich mich. Er näherte sich mir in den Goldenen Hallen. Ein mir unbekanntes Gesicht. Aber das ist nicht so ungewöhnlich für unseresgleichen. Ich kannte seine Stimme. Ich kannte seine Bewegungen.</text>
</g>
