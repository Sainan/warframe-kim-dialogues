<text text-anchor="middle" x="608" y="-320.3" font-family="Times New Roman,serif" font-size="14.00">Als die Sentients angriffen, erlebten wir eine Einheit, die uns lange verwehrt geblieben war. Die Dax zogen ihre Schwerter gegen etwas anderes als einen unverschämten Bauern oder einen diebischen Händler.</text>
