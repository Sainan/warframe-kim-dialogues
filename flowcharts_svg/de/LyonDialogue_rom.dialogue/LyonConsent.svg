<text xml:space="preserve" text-anchor="middle" x="695" y="-358.95" font-family="Times New Roman,serif" font-size="14.00">So wie wir sind – so wie ich bin, mit allem, was du mir gebracht hast, allem, wofür wir stehen ... bin ich zufrieden. Nein, ich bin ... glücklich. Zum ersten Mal seit sehr, sehr langer Zeit.</text>
