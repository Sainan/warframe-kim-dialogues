<text text-anchor="middle" x="594.5" y="-662.3" font-family="Times New Roman,serif" font-size="14.00">Ich weiß nicht, wie ich es beschreiben soll, außer als das, was es ist ... als würde ich nach etwas greifen, nur um zu sehen, wie mir Staubkörner durch die Finger gleiten.</text>
</g>
