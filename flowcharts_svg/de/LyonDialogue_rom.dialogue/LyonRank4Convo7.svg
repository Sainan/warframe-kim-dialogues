<text xml:space="preserve" text-anchor="middle" x="589.25" y="-588.95" font-family="Times New Roman,serif" font-size="14.00">Es fühlt sich an, als wäre ich ein leerer Fetzen Leinwand, auf dessen Oberfläche Ölfarben verschmieren, ein nutzloser Versuch den Schatten eines Bildes zu erstellen, den ich vor meinem inneren Auge sehen kann.</text>
