<text text-anchor="middle" x="594.5" y="-590.3" font-family="Times New Roman,serif" font-size="14.00">Es fühlt sich an, als wäre ich ein leerer Fetzen Leinwand, auf dessen Oberfläche Ölfarben verschmieren, ein nutzloser Versuch den Schatten eines Bildes zu erstellen, den ich vor meinem inneren Auge sehen kann.</text>
</g>
