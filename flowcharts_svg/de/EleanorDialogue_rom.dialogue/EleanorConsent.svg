<!-- j2627341545 -->
<g id="node8" class="node">
<title>j2627341545</title>
<polygon fill="none" stroke="blue" points="984.5,-707 449.5,-707 449.5,-671 984.5,-671 984.5,-707"/>
<text text-anchor="middle" x="717" y="-685.3" font-family="Times New Roman,serif" font-size="14.00">Nicht, dass ich nicht wüsste, dass du kurz davor warst, höflich um Erlaubnis zu bitten. Hallo.</text>
</g>
