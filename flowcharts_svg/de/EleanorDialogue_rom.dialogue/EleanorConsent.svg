<polygon fill="none" stroke="red" points="1346.75,-489.5 279.25,-489.5 279.25,-453.5 1346.75,-453.5 1346.75,-489.5"/>
<text xml:space="preserve" text-anchor="middle" x="813" y="-466.45" font-family="Times New Roman,serif" font-size="14.00">Es tut mir leid. Ich wollte dich tatsächlich um deine Zustimmung bitten. Ich weiß, wir haben das vorher noch nie besprochen. Ich wollte nur sichergehen, dass das alles für dich in Ordnung ist.</text>
</g>
