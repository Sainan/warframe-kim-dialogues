<text text-anchor="middle" x="682.5" y="-379.3" font-family="Times New Roman,serif" font-size="14.00">Natürlich ist es das! Ich kann die Person vor deinem inneren Auge sehen. Und wenn du ihr vertraust, dann vertraue ich diesem Geschöpf auch.</text>
</g>
