<title>j3741153032</title>
<polygon fill="none" stroke="blue" points="1306,-401 496,-401 496,-365 1306,-365 1306,-401"/>
<text text-anchor="middle" x="901" y="-379.3" font-family="Times New Roman,serif" font-size="14.00">Natürlich ist es das! Ich kann die Person vor deinem inneren Auge sehen. Und wenn du ihr vertraust, dann vertraue ich diesem Geschöpf auch.</text>
</g>
