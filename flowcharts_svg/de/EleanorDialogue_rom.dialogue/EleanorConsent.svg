<!-- j1908864207 -->
<g id="node9" class="node">
<title>j1908864207</title>
<polygon fill="none" stroke="blue" points="1393.5,-634 28.5,-634 28.5,-598 1393.5,-598 1393.5,-634"/>
<text text-anchor="middle" x="711" y="-612.3" font-family="Times New Roman,serif" font-size="14.00">Die Antwort ist ein sehr schmollendes, mit verschränkten Armen einhergehendes &quot;Ja, natürlich&quot;, während ich hier sitze und nicht daran denke, wie du dich mit diesem wunderschönen Wesen, das ich in deinen Fantasien erblickt habe, vergnügst.</text>
</g>
<!-- j2627341545&#45;&gt;j1908864207 -->
<g id="edge11" class="edge">
<title>j2627341545&#45;&gt;j1908864207</title>
