<!-- 3321 -->
<g id="node11" class="node">
<title>3321</title>
<polygon fill="none" stroke="blue" points="1365,-620 0,-620 0,-584 1365,-584 1365,-620"/>
<text text-anchor="middle" x="682.5" y="-598.3" font-family="Times New Roman,serif" font-size="14.00">Die Antwort ist ein sehr schmollendes, mit verschränkten Armen einhergehendes &quot;Ja, natürlich&quot;, während ich hier sitze und nicht daran denke, wie du dich mit diesem wunderschönen Wesen, das ich in deinen Fantasien erblickt habe, vergnügst.</text>
</g>
