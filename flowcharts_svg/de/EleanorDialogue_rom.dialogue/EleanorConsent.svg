<polygon fill="none" stroke="red" points="1221.5,-474 143.5,-474 143.5,-438 1221.5,-438 1221.5,-474"/>
<text text-anchor="middle" x="682.5" y="-452.3" font-family="Times New Roman,serif" font-size="14.00">Es tut mir leid. Ich wollte dich tatsächlich um deine Zustimmung bitten. Ich weiß, wir haben das vorher noch nie besprochen. Ich wollte nur sichergehen, dass das alles für dich in Ordnung ist.</text>
</g>
