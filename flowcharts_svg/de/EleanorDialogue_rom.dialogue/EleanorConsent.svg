<polygon fill="none" stroke="blue" points="1379.88,-635.5 28.12,-635.5 28.12,-599.5 1379.88,-599.5 1379.88,-635.5"/>
<text xml:space="preserve" text-anchor="middle" x="704" y="-612.45" font-family="Times New Roman,serif" font-size="14.00">Die Antwort ist ein sehr schmollendes, mit verschränkten Armen einhergehendes &quot;Ja, natürlich&quot;, während ich hier sitze und nicht daran denke, wie du dich mit diesem wunderschönen Wesen, das ich in deinen Fantasien erblickt habe, vergnügst.</text>
</g>
