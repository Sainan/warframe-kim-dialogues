<!-- j2184443903 -->
<g id="node11" class="node">
<title>j2184443903</title>
<polygon fill="none" stroke="red" points="1352,-488 274,-488 274,-452 1352,-452 1352,-488"/>
<text text-anchor="middle" x="813" y="-466.3" font-family="Times New Roman,serif" font-size="14.00">Es tut mir leid. Ich wollte dich tatsächlich um deine Zustimmung bitten. Ich weiß, wir haben das vorher noch nie besprochen. Ich wollte nur sichergehen, dass das alles für dich in Ordnung ist.</text>
</g>
