<text xml:space="preserve" text-anchor="middle" x="714" y="-685.45" font-family="Times New Roman,serif" font-size="14.00">Nicht, dass ich nicht wüsste, dass du kurz davor warst, höflich um Erlaubnis zu bitten. Hallo.</text>
