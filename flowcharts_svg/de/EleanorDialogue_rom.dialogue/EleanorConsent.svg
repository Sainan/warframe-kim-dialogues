<text text-anchor="middle" x="682.5" y="-525.3" font-family="Times New Roman,serif" font-size="14.00">Das jetzt in MEINEN Fantasien existiert, da ich hier in dieser Zeit und an diesem Ort festsitze, vielen Dank!</text>
</g>
