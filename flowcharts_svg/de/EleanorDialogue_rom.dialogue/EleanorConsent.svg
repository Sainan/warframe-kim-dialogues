<text text-anchor="middle" x="779" y="-539.3" font-family="Times New Roman,serif" font-size="14.00">Das jetzt in MEINEN Fantasien existiert, da ich hier in dieser Zeit und an diesem Ort festsitze, vielen Dank!</text>
</g>
<!-- j1908864207&#45;&gt;j2262766813 -->
<g id="edge12" class="edge">
