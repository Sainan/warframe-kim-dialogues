<text text-anchor="middle" x="661.5" y="-878.3" font-family="Times New Roman,serif" font-size="14.00">Bonjour, bonjour ! Du musst der Drifter sein, oui ? Monsieur Loid hat mir sehr viel über dich erzählt. Ich freue mich sehr, dich zu &quot;treffen&quot; auf diesem ...</text>
</g>
