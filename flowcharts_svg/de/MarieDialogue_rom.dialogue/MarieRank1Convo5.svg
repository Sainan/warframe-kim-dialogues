<text text-anchor="middle" x="612.5" y="-518.3" font-family="Times New Roman,serif" font-size="14.00">Oui, ce monstre irritant à la peau bleue, das uns le Cardinal anvertraut hat. Ich glaube, du kennst ihn als Albrecht Entrati ? Er ist der Grund, warum wir hier sind. Aber das ist eine sehr lange Geschichte, j&#39;en ai bien peur.</text>
