<text xml:space="preserve" text-anchor="middle" x="709" y="-660.95" font-family="Times New Roman,serif" font-size="14.00">Es freut mich, dich kennenzulernen. Versteh das bitte nicht falsch, ihr seid hier durchaus willkommen, aber ... was macht ihr alle hier?</text>
</g>
