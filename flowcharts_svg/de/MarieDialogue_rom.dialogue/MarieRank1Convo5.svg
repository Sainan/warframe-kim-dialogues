<text xml:space="preserve" text-anchor="middle" x="709" y="-732.95" font-family="Times New Roman,serif" font-size="14.00">Ich bin Sœur Marie Leroux, aber du kannst Marie sagen. Ich bin vor Kurzem hier mit meinem Seelenbruder, Pater Lyon Allard, eingetroffen und ... naja, ich denke Monsieur Loid könnte dich vor dem Teufel gewart haben, n&#39;est&#45;ce pas ?</text>
</g>
