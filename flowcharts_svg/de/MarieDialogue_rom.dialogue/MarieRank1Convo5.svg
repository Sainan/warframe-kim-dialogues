<text text-anchor="middle" x="715" y="-662.3" font-family="Times New Roman,serif" font-size="14.00">Es freut mich, dich kennenzulernen. Versteh das bitte nicht falsch, ihr seid hier durchaus willkommen, aber ... was macht ihr alle hier?</text>
</g>
