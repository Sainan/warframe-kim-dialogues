<text text-anchor="middle" x="765.58" y="-633.3" font-family="Times New Roman,serif" font-size="14.00">And I simply wished to assure you that this does not give me pause nor unease. Your presence in my life has brought me nothing but peace, nothing but joy...</text>
</g>
