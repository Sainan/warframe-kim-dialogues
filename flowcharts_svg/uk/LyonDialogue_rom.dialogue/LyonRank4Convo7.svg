<!-- j4019497296 -->
<g id="node12" class="node">
<title>j4019497296</title>
<polygon fill="none" stroke="blue" points="1202,-612 228,-612 228,-576 1202,-576 1202,-612"/>
<text text-anchor="middle" x="715" y="-590.3" font-family="Times New Roman,serif" font-size="14.00">It feels oft as though I am an empty scrap of canvas, smearing oil paints upon its surface &#45; uselessly attempting create a shadow of an image that I can see in my mind&#39;s eye.</text>
</g>
<!-- j540466264&#45;&gt;j4019497296 -->
<g id="edge12" class="edge">
<title>j540466264&#45;&gt;j4019497296</title>
