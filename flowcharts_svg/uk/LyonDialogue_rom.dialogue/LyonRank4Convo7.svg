<text text-anchor="middle" x="715" y="-518.3" font-family="Times New Roman,serif" font-size="14.00">Yet the more and more I work, the more and more hopeless it becomes.</text>
</g>
<!-- j4019497296&#45;&gt;j2007086283 -->
<g id="edge13" class="edge">
<title>j4019497296&#45;&gt;j2007086283</title>
