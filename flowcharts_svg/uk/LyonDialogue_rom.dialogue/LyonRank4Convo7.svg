<polygon fill="none" stroke="blue" points="1102,-684 328,-684 328,-648 1102,-648 1102,-684"/>
<text text-anchor="middle" x="715" y="-662.3" font-family="Times New Roman,serif" font-size="14.00">I do not know how to describe it &#45; save for that it is... like I am grasping for something, only to see bits of dust slip through my fingers. </text>
</g>
