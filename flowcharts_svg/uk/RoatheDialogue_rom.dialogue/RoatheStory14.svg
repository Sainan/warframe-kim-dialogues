<polygon fill="none" stroke="blue" points="1278.5,-328 121.5,-328 121.5,-292 1278.5,-292 1278.5,-328"/>
<text text-anchor="middle" x="700" y="-306.3" font-family="Times New Roman,serif" font-size="14.00">Це було якесь божевілля. Як я можу напарцьовувати стратегії боїв із крабоподібними зорельотами свідомих, якщо одразу після винайдення такої ці судна замінили кротовинні зорельоти?</text>
</g>
