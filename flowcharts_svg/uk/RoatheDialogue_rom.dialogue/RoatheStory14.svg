<text xml:space="preserve" text-anchor="middle" x="688" y="-466.45" font-family="Times New Roman,serif" font-size="14.00">Витяг: Багато свідомих еволюціонували в сутичках, тому ми не мали впевненості, що зустрінемося з одним і тим самим ворогом двічі. Але інші лишалися в незмінній формі, наче вже давно досягли якоїсь певної точки.</text>
