<polygon fill="none" stroke="blue" points="1371.5,-488 28.5,-488 28.5,-452 1371.5,-452 1371.5,-488"/>
<text text-anchor="middle" x="700" y="-466.3" font-family="Times New Roman,serif" font-size="14.00">Витяг: Багато свідомих еволюціонували в сутичках, тому ми не мали впевненості, що зустрінемося з одним і тим самим ворогом двічі. Але інші лишалися в незмінній формі, наче вже давно досягли якоїсь певної точки.</text>
</g>
