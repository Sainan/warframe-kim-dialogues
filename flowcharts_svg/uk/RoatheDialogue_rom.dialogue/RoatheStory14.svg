<text xml:space="preserve" text-anchor="middle" x="688" y="-304.95" font-family="Times New Roman,serif" font-size="14.00">Це було якесь божевілля. Як я можу напарцьовувати стратегії боїв із крабоподібними зорельотами свідомих, якщо одразу після винайдення такої ці судна замінили кротовинні зорельоти?</text>
