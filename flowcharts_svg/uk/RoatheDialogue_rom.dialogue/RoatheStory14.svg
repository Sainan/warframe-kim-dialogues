<polygon fill="none" stroke="blue" points="1343,-547 0,-547 0,-511 1343,-511 1343,-547"/>
<text text-anchor="middle" x="671.5" y="-525.3" font-family="Times New Roman,serif" font-size="14.00">Витяг: Багато свідомих еволюціонували в сутичках, тому ми не мали впевненості, що зустрінемося з одним і тим самим ворогом двічі. Але інші лишалися в незмінній формі, наче вже давно досягли якоїсь певної точки.</text>
</g>
