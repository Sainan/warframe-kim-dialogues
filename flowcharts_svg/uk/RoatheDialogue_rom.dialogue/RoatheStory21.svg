<polygon fill="none" stroke="blue" points="1129.25,-635.5 136.75,-635.5 136.75,-599.5 1129.25,-599.5 1129.25,-635.5"/>
<text xml:space="preserve" text-anchor="middle" x="633" y="-612.45" font-family="Times New Roman,serif" font-size="14.00">Я пам’ятаю тепер. Він підійшов до мене в Золотих Залах. Він мав обличчя, якого я не знав. Але для нашого роду це не рідкість. Я знав його голос. Я знав його рухи.</text>
