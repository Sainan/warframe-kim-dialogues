<polygon fill="none" stroke="blue" points="1237.62,-781.5 28.38,-781.5 28.38,-745.5 1237.62,-745.5 1237.62,-781.5"/>
<text xml:space="preserve" text-anchor="middle" x="633" y="-758.45" font-family="Times New Roman,serif" font-size="14.00">Саме так вони мене називали, чи не так? Я читав історичні записи, розкидані по цій запиленій залі. Брехня. Вони не знали правди. Того, що мене вирвали з мого часу, перш ніж я завершив свою справу.</text>
</g>
