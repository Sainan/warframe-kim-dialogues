<polygon fill="none" stroke="blue" points="1270,-780 28,-780 28,-744 1270,-744 1270,-780"/>
<text text-anchor="middle" x="649" y="-758.3" font-family="Times New Roman,serif" font-size="14.00">Саме так вони мене називали, чи не так? Я читав історичні записи, розкидані по цій запиленій залі. Брехня. Вони не знали правди. Того, що мене вирвали з мого часу, перш ніж я завершив свою справу.</text>
</g>
