<text text-anchor="middle" x="649" y="-612.3" font-family="Times New Roman,serif" font-size="14.00">Я пам’ятаю тепер. Він підійшов до мене в Золотих Залах. Він мав обличчя, якого я не знав. Але для нашого роду це не рідкість. Я знав його голос. Я знав його рухи.</text>
