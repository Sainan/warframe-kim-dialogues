<text text-anchor="middle" x="507.84" y="-612.3" font-family="Times New Roman,serif" font-size="14.00">Витяг: Я від самого початку зрозумів (як на бойовищі, так і любовному ложі), що шлях до перемоги йде через удавану покору.</text>
