<g id="node6" class="node">
<title>j435680314</title>
<polygon fill="none" stroke="blue" points="1444,-561 28,-561 28,-525 1444,-525 1444,-561"/>
<text text-anchor="middle" x="736" y="-539.3" font-family="Times New Roman,serif" font-size="14.00">Витяг: Трейвон. Я спостерігав, як ти направив свій рейкоджек просто в пащу «Праґаси». Утративши пильність, у жадобі пожираючи тебе й твій екіпаж, вона так і не помітила, як моє власне судно на повній швидкості віддаляється.</text>
</g>
<!-- j4219466231&#45;&gt;j435680314 -->
