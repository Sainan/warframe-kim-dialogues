<text xml:space="preserve" text-anchor="middle" x="723" y="-393.45" font-family="Times New Roman,serif" font-size="14.00">Марино. Ти віддала мені своє тіло. Разом, у тому окопі, ми пили куву. Мої руки тремтіли, моє розпанахане горло сочилося, але я втримав достатньо крапель, аби вона подіяла.</text>
</g>
