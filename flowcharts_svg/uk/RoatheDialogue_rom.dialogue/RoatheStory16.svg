<g id="node8" class="node">
<title>j2109391167</title>
<polygon fill="none" stroke="blue" points="1278,-415 194,-415 194,-379 1278,-379 1278,-415"/>
<text text-anchor="middle" x="736" y="-393.3" font-family="Times New Roman,serif" font-size="14.00">Марино. Ти віддала мені своє тіло. Разом, у тому окопі, ми пили куву. Мої руки тремтіли, моє розпанахане горло сочилося, але я втримав достатньо крапель, аби вона подіяла.</text>
</g>
