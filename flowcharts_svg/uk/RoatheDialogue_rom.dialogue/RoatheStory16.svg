<text text-anchor="middle" x="708" y="-598.3" font-family="Times New Roman,serif" font-size="14.00">Витяг: Трейвон. Я спостерігав, як ти направив свій рейкоджек просто в пащу «Праґаси». Утративши пильність, у жадобі пожираючи тебе й твій екіпаж, вона так і не помітила, як моє власне судно на повній швидкості віддаляється.</text>
</g>
