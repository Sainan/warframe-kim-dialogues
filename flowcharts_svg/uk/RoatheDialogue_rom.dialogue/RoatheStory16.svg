<text text-anchor="middle" x="708" y="-452.3" font-family="Times New Roman,serif" font-size="14.00">Марино. Ти віддала мені своє тіло. Разом, у тому окопі, ми пили куву. Мої руки тремтіли, моє розпанахане горло сочилося, але я втримав достатньо крапель, аби вона подіяла.</text>
