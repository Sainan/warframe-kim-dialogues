<text text-anchor="middle" x="811" y="-518.3" font-family="Times New Roman,serif" font-size="14.00">Merci ! Чому, як і для чого ми тут опинилися буде дуже довго розписувати, j&#39;en ai bien peur. Нас сюди послав le Cardinal. Думаю, що тут його знають як Альбрехта Ентраті, oui ? Нам довірено наглядати за тим синьошкірим monstre irritant.</text>
