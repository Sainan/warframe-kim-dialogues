<text text-anchor="middle" x="593.5" y="-518.3" font-family="Times New Roman,serif" font-size="14.00">Oui, ce monstre irritant à la peau bleue, якого нам довірено le Cardinal. Думаю, тут ви його звете Альбрехтом Ентраті, oui ? Саме через нього ми тут. Але це дуже&#45;дуже довга історія, j&#39;en ai bien peur.</text>
