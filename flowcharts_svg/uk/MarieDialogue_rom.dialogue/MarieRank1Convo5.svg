<text xml:space="preserve" text-anchor="middle" x="792.88" y="-516.95" font-family="Times New Roman,serif" font-size="14.00">Merci ! Чому, як і для чого ми тут опинилися буде дуже довго розписувати, j&#39;en ai bien peur. Нас сюди послав le Cardinal. Думаю, що тут його знають як Альбрехта Ентраті, oui ? Нам довірено наглядати за тим синьошкірим monstre irritant.</text>
