<!-- j2234745481 -->
<g id="node2" class="node">
<title>j2234745481</title>
<polygon fill="none" stroke="blue" points="1127,-900 237,-900 237,-864 1127,-864 1127,-900"/>
<text text-anchor="middle" x="682" y="-878.3" font-family="Times New Roman,serif" font-size="14.00">Bonjour, bonjour ! Це тебе кличуть «мандрівниче», oui ? Монсеньор Лойд дуже багато про тебе розповідав. Дуже рада «познайомитися» у цій…</text>
</g>
