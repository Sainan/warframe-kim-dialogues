<!-- j1112474590 -->
<g id="node4" class="node">
<title>j1112474590</title>
<polygon fill="none" stroke="blue" points="1493,-756 129,-756 129,-720 1493,-720 1493,-756"/>
<text text-anchor="middle" x="811" y="-734.3" font-family="Times New Roman,serif" font-size="14.00">Я — Sœur Marie Leroux, але можеш називати мене Марі. Не так давно ми прибули сюди разом із моїм духовним братом, отцем Ліоном Аллардом і… гадаю, монсеньйор Лойд уже попередив тебе про диявола, n’est&#45;ce pas ?</text>
</g>
<!-- j43215365&#45;&gt;j1112474590 -->
<g id="edge3" class="edge">
