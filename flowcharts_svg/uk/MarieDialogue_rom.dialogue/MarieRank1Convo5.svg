<!-- j2234745481 -->
<g id="node2" class="node">
<title>j2234745481</title>
<polygon fill="none" stroke="blue" points="1256,-900 366,-900 366,-864 1256,-864 1256,-900"/>
<text text-anchor="middle" x="811" y="-878.3" font-family="Times New Roman,serif" font-size="14.00">Bonjour, bonjour ! Це тебе кличуть «мандрівниче», oui ? Монсеньор Лойд дуже багато про тебе розповідав. Дуже рада «познайомитися» у цій…</text>
</g>
