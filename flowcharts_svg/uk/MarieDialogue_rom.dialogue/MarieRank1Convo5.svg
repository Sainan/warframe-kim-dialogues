<polygon fill="none" stroke="blue" points="2507.5,-756 1143.5,-756 1143.5,-720 2507.5,-720 2507.5,-756"/>
<text text-anchor="middle" x="1825.5" y="-734.3" font-family="Times New Roman,serif" font-size="14.00">Я — Sœur Marie Leroux, але можеш називати мене Марі. Не так давно ми прибули сюди разом із моїм духовним братом, отцем Ліоном Аллардом і… гадаю, монсеньйор Лойд уже попередив тебе про диявола, n’est&#45;ce pas ?</text>
</g>
