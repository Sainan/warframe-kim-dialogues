<polygon fill="none" stroke="blue" points="2168.5,-900 1278.5,-900 1278.5,-864 2168.5,-864 2168.5,-900"/>
<text text-anchor="middle" x="1723.5" y="-878.3" font-family="Times New Roman,serif" font-size="14.00">Bonjour, bonjour ! Це тебе кличуть «мандрівниче», oui ? Монсеньор Лойд дуже багато про тебе розповідав. Дуже рада «познайомитися» у цій…</text>
</g>
