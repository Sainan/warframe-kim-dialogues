<text xml:space="preserve" text-anchor="middle" x="792.88" y="-876.95" font-family="Times New Roman,serif" font-size="14.00">Bonjour, bonjour ! Це тебе кличуть «мандрівниче», oui ? Монсеньор Лойд дуже багато про тебе розповідав. Дуже рада «познайомитися» у цій…</text>
