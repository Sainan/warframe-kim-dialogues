<!-- j3913865978 -->
<g id="node5" class="node">
<title>j3913865978</title>
<polygon fill="none" stroke="red" points="1100.5,-684 521.5,-684 521.5,-648 1100.5,-648 1100.5,-684"/>
<text text-anchor="middle" x="811" y="-662.3" font-family="Times New Roman,serif" font-size="14.00">Приємно познайомитися. Не подумай, що це грубість — вам тут раді, але… чому ви всі тут?</text>
</g>
