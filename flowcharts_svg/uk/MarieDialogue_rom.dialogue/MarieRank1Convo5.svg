<text text-anchor="middle" x="1208" y="-374.3" font-family="Times New Roman,serif" font-size="14.00">Ми маємо зробити все можливе, щоб направити його душу на шлях істинний, si c’est possible. Et si ce n’est pas le cas ? Тоді ж маємо впевнитися, що він більше ніколи нікого не скривдить.</text>
</g>
