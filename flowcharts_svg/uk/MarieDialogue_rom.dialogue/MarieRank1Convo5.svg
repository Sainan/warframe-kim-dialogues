<text xml:space="preserve" text-anchor="middle" x="792.88" y="-732.95" font-family="Times New Roman,serif" font-size="14.00">Я — Sœur Marie Leroux, але можеш називати мене Марі. Не так давно ми прибули сюди разом із моїм духовним братом, отцем Ліоном Аллардом і… гадаю, монсеньйор Лойд уже попередив тебе про диявола, n’est&#45;ce pas ?</text>
</g>
