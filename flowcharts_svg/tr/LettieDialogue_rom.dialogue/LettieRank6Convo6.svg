<text text-anchor="middle" x="411" y="-243.8" font-family="Times New Roman,serif" font-size="14.00">Ve şu Velimir beni gülümsetiyor&#13;</text>
<text text-anchor="middle" x="411" y="-228.8" font-family="Times New Roman,serif" font-size="14.00">Tam olarak kim olduğunu bilen bir adamı takdir ederim&#13;</text>
<text text-anchor="middle" x="411" y="-213.8" font-family="Times New Roman,serif" font-size="14.00">Alguien auténtico y fiel a sí mismo, ¿sí?&#13;</text>
<text text-anchor="middle" x="411" y="-198.8" font-family="Times New Roman,serif" font-size="14.00">Geçen gün Aoi&#39;nin onun tırnaklarını boyamasına müsaade etmişti jajajaja&#13;</text>
<text text-anchor="middle" x="411" y="-183.8" font-family="Times New Roman,serif" font-size="14.00">O sırada da en sevdiği klasik Libertatia yüksek performans arabaları hakkında sohbet ediyordu&#13;</text>
<text text-anchor="middle" x="411" y="-168.8" font-family="Times New Roman,serif" font-size="14.00">Hiçbir şeyi takmadan kendince eğleniyordu</text>
