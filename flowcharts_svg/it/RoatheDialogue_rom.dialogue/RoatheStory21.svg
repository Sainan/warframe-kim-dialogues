<polygon fill="none" stroke="blue" points="1254.25,-781.5 27.75,-781.5 27.75,-745.5 1254.25,-745.5 1254.25,-781.5"/>
<text xml:space="preserve" text-anchor="middle" x="641" y="-758.45" font-family="Times New Roman,serif" font-size="14.00">È così che mi chiamavano, non è vero? Ho letto i libri i storia sparci per questa sala polverosa. È una bugia. Non conoscevano la verità. Che sono stato strappato via dal mio tempo prima di poter completare il mio lavoro.</text>
