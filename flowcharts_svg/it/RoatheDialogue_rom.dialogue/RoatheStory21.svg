<polygon fill="none" stroke="blue" points="1274,-780 28,-780 28,-744 1274,-744 1274,-780"/>
<text text-anchor="middle" x="651" y="-758.3" font-family="Times New Roman,serif" font-size="14.00">È così che mi chiamavano, non è vero? Ho letto i libri i storia sparci per questa sala polverosa. È una bugia. Non conoscevano la verità. Che sono stato strappato via dal mio tempo prima di poter completare il mio lavoro.</text>
</g>
