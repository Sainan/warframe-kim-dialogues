<text xml:space="preserve" text-anchor="middle" x="641" y="-612.45" font-family="Times New Roman,serif" font-size="14.00">Ora ricordo. Si avvicinò a me, nelle Sale Dorate. Aveva un volto che non conoscevo. Ma non è poi così insolito per la nostra specie. Conoscevo la sua voce. Conoscevo il modo in cui si muoveva.</text>
