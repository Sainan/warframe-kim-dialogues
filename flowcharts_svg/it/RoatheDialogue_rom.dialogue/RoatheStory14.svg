<text xml:space="preserve" text-anchor="middle" x="751" y="-304.95" font-family="Times New Roman,serif" font-size="14.00">Era follia. Come potevo elaborare strategie per aggirare il comportamento delle navi&#45;granchio dei Sentient, quando non appena le mie tattiche erano state perfezionate, le navi&#45;granchio erano state sostituite dalle navi&#45;verme?</text>
