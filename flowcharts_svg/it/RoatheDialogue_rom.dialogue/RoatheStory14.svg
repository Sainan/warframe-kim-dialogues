<text text-anchor="middle" x="758" y="-160.3" font-family="Times New Roman,serif" font-size="14.00">Non potevamo fare altro che tornare indietro, il progresso era stato fatale. Le vecchie tradizioni, i sentieri consacrati dal tempo dell&#39;onore e della disciplina, avevano il loro giusto valore.</text>
