<text xml:space="preserve" text-anchor="middle" x="751" y="-466.45" font-family="Times New Roman,serif" font-size="14.00">Trascrizione: Molti dei Sentient si evolvevano tra un incontro e l&#39;altro, quindi non potevamo mai essere certi di affrontare lo stesso nemico due volte. Ma altri rimanevano in una forma costante, come se avessero raggiunto un punto di svolta molto tempo prima.</text>
