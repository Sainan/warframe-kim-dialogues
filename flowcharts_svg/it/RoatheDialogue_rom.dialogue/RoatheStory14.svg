<g id="node8" class="node">
<title>j3554508924</title>
<polygon fill="none" stroke="blue" points="1381,-328 135,-328 135,-292 1381,-292 1381,-328"/>
<text text-anchor="middle" x="758" y="-306.3" font-family="Times New Roman,serif" font-size="14.00">Era follia. Come potevo elaborare strategie per aggirare il comportamento delle navi&#45;granchio dei Sentient, quando non appena le mie tattiche erano state perfezionate, le navi&#45;granchio erano state sostituite dalle navi&#45;verme?</text>
</g>
