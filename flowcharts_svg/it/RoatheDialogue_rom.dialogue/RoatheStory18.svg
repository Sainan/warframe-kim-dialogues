<text text-anchor="middle" x="512" y="-306.3" font-family="Times New Roman,serif" font-size="14.00">Dopo di che sarebbe emersa dal nascondiglio e… beh, qui non mi resta che fare delle ipotesi. Forse si aspettava di essere invitata a entrare nella confidenza dei Sentient.</text>
</g>
