<text text-anchor="middle" x="512" y="-393.3" font-family="Times New Roman,serif" font-size="14.00">L&#39;Esecutrice Nitokh era contrariata. Si aspettava una gloriosa escalation, battaglia dopo battaglia, che si sarebbe conclusa con l&#39;estasi culminante della disfatta degli Orokin.</text>
</g>
