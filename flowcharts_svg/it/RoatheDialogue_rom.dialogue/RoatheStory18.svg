<text text-anchor="middle" x="512" y="-233.3" font-family="Times New Roman,serif" font-size="14.00">O forse pensava che avrebbero abbandonato i resti bruciati e inquinati del Sistema Origin e l&#39;avrebbero lasciata a fondare un nuovo regno tutto suo.</text>
