<text text-anchor="middle" x="617" y="-393.3" font-family="Times New Roman,serif" font-size="14.00">Maryna. Mi hai donato il tuo corpo. Insieme, in quella trincea, abbiamo bevuto Kuva. Le mie mani tremavano e la mia gola colava, ma ho trattenuto abbastanza gocce perché si assorbisse.</text>
</g>
