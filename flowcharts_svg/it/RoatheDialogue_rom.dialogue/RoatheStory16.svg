<polygon fill="none" stroke="blue" points="1086,-328 148,-328 148,-292 1086,-292 1086,-328"/>
<text text-anchor="middle" x="617" y="-306.3" font-family="Times New Roman,serif" font-size="14.00">Ricordo il tuo ultimo saluto. La scomparsa. Poi ho sbattuto le palpebre per aprire gli occhi che erano stati i tuoi e ho visto il mio cadavere sventrato, morto nel fango.</text>
</g>
