<text xml:space="preserve" text-anchor="middle" x="608" y="-539.45" font-family="Times New Roman,serif" font-size="14.00">Trascrizione: Traivon. Ti ho visto scagliare il tuo Railjack nelle fauci di Praghasa. Distratta, nutrendosi avidamente di te e dei tuoi uomini, non si è mai accorta della mia nave che si allontanava a tutta velocità.</text>
