<text text-anchor="middle" x="1892" y="-518.3" font-family="Times New Roman,serif" font-size="14.00">Oui, ce monstre irritant à la peau bleue che ci è stato affidato dal Cardinale. Credo che lo conosci come Albrecht Entrati? È il motivo per cui siamo qui. Ma questa è una storia molto lunga, j&#39;en ai bien peur.</text>
