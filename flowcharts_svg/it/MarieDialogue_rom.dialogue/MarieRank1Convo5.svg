<text text-anchor="middle" x="676" y="-878.3" font-family="Times New Roman,serif" font-size="14.00">Bonjour, bonjour! Tu devi essere il Drifter, oui ? Monsieur Loid mi ha parlato tanto di te. Sono davvero felice di &quot;incontrarti&quot; in questo...</text>
