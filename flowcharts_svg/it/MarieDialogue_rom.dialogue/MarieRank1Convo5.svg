<text xml:space="preserve" text-anchor="middle" x="680" y="-876.95" font-family="Times New Roman,serif" font-size="14.00">Bonjour, bonjour! Tu devi essere il Drifter, oui ? Monsieur Loid mi ha parlato tanto di te. Sono davvero felice di &quot;incontrarti&quot; in questo...</text>
