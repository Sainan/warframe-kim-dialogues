<text text-anchor="middle" x="687" y="-518.3" font-family="Times New Roman,serif" font-size="14.00">Merci ! Il cosa e il come della nostra presenza qui è una storia molto lunga, j&#39;en ai bien peur. Siamo stati mandati qui da le Cardinal. Credo che lo conosci come Albrecht Entrati? Ci ha affidato quel monstre irritant dalla pelle blu.</text>
