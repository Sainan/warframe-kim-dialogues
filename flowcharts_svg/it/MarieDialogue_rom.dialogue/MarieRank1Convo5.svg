<text xml:space="preserve" text-anchor="middle" x="680" y="-732.95" font-family="Times New Roman,serif" font-size="14.00">Sono Sœur Marie Leroux, ma puoi chiamarmi Marie. Sono arrivata di recente con il fratello della mia anima, Padre Lyon Allard e... beh, credo che Monsieur Loid ti abbia messo in guardia dal diavolo, n&#39;est&#45;ce pas ?</text>
</g>
