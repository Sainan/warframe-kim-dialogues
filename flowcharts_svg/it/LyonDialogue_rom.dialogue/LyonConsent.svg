<text text-anchor="middle" x="961.58" y="-360.3" font-family="Times New Roman,serif" font-size="14.00">As we are &#45; as I am, with all you have brought me, all that we represent... I am content. Nay, I am... happy. For the first time in a very, very long time.</text>
</g>
