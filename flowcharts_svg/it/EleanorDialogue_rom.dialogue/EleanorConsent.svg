<text text-anchor="middle" x="656.58" y="-452.3" font-family="Times New Roman,serif" font-size="14.00">Mi dispiace. Stavo veramente per venire a chiederti il consenso. So che non è qualcosa di cui abbiamo già parlato. Volevo assicurarmi che che tu fossi d&#39;accordo.</text>
