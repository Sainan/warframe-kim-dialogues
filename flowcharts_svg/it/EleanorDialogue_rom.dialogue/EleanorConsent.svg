<text xml:space="preserve" text-anchor="middle" x="570" y="-612.45" font-family="Times New Roman,serif" font-size="14.00">La mia risposta molto imbronciata e con le braccia incrociate è un &#39;sì, certo&#39;, mentre io me ne sto qui seduta senza pensare a te che ti diverti con quella bellezza che ho intravisto nelle tue fantasie.</text>
</g>
