<text text-anchor="middle" x="656.58" y="-525.3" font-family="Times New Roman,serif" font-size="14.00">Ora è nelle MIE fantasie, io che sono bloccata qui, in questo tempo e in questo luogo, grazie&#45;mille&#45;tantissime!</text>
</g>
