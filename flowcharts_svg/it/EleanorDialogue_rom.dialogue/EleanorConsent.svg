<polygon fill="none" stroke="blue" points="1124,-634 28,-634 28,-598 1124,-598 1124,-634"/>
<text text-anchor="middle" x="576" y="-612.3" font-family="Times New Roman,serif" font-size="14.00">La mia risposta molto imbronciata e con le braccia incrociate è un &#39;sì, certo&#39;, mentre io me ne sto qui seduta senza pensare a te che ti diverti con quella bellezza che ho intravisto nelle tue fantasie.</text>
</g>
<!-- j2208047803&#45;&gt;j3098317604 -->
<g id="edge11" class="edge">
<title>j2208047803&#45;&gt;j3098317604</title>
