<polygon fill="none" stroke="blue" points="1204.58,-620 108.58,-620 108.58,-584 1204.58,-584 1204.58,-620"/>
<text text-anchor="middle" x="656.58" y="-598.3" font-family="Times New Roman,serif" font-size="14.00">La mia risposta molto imbronciata e con le braccia incrociate è un &#39;sì, certo&#39;, mentre io me ne sto qui seduta senza pensare a te che ti diverti con quella bellezza che ho intravisto nelle tue fantasie.</text>
</g>
