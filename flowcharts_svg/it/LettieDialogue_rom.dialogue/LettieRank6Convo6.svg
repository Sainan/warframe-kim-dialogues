<text text-anchor="middle" x="601.5" y="-183.8" font-family="Times New Roman,serif" font-size="14.00">Mentre discutevano delle loro auto classiche Libertatiane preferite&#13;</text>
<text text-anchor="middle" x="601.5" y="-168.8" font-family="Times New Roman,serif" font-size="14.00">Non gliene fregava niente</text>
