<text text-anchor="middle" x="419" y="-125.8" font-family="Times New Roman,serif" font-size="14.00">彼らの命は短いけど、一生を生きることを忘れはしない&#13;</text>
<text text-anchor="middle" x="419" y="-110.8" font-family="Times New Roman,serif" font-size="14.00">パンくず探すのにできる限りの喜びを見つけて&#13;</text>
<text text-anchor="middle" x="419" y="-95.8" font-family="Times New Roman,serif" font-size="14.00">与えられた愛を少しも残さず返す&#13;</text>
<text text-anchor="middle" x="419" y="-80.8" font-family="Times New Roman,serif" font-size="14.00">いつ去るかを知ることもなく</text>
</g>
