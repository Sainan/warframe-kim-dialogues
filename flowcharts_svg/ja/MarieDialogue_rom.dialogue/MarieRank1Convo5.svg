<polygon fill="none" stroke="blue" points="1305,-756 4,-756 4,-720 1305,-720 1305,-756"/>
<text text-anchor="middle" x="654.5" y="-734.3" font-family="Times New Roman,serif" font-size="14.00">私は修道女のMarie Lerouxです。Marieと呼んでください。最近、魂の兄弟である神父Lyon Allardと一緒にここへ参りました。　…あの、Loid様が悪魔について警告したかもしれませんね。</text>
