<text text-anchor="middle" x="654.5" y="-518.3" font-family="Times New Roman,serif" font-size="14.00">Merci ! The what and the how of our being here is a very long story, j&#39;en ai bien peur. We were sent here by le Cardinal. I believe you know him as Albrecht Entrati ? He entrusted us with that blue&#45;skinned monstre irritant.</text>
