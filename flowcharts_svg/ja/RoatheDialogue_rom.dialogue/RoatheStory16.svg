<!-- 2275 -->
<g id="node7" class="node">
<title>2275</title>
<polygon fill="none" stroke="blue" points="1257,-620 25,-620 25,-584 1257,-584 1257,-620"/>
<text text-anchor="middle" x="641" y="-598.3" font-family="Times New Roman,serif" font-size="14.00">Traivon。お前が乗るレールジャックをPraghasaの口に投げ込むのを見た。お前とその部下を貪欲に食らうのに気を取られ、Praghasaは我の船が逃げていくのに気づかなかった。</text>
</g>
