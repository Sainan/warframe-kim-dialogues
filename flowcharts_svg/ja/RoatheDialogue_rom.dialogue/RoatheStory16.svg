<!-- j3541985483 -->
<g id="node9" class="node">
<title>j3541985483</title>
<polygon fill="none" stroke="blue" points="1268,-328 70,-328 70,-292 1268,-292 1268,-328"/>
<text text-anchor="middle" x="669" y="-306.3" font-family="Times New Roman,serif" font-size="14.00">お前の最後の敬礼を覚えている。途絶えるあの瞬間を。それから瞬きをして、お前のものだった目を開けると、泥の中に横たわる、内臓を抜かれた我の死体が見えた。</text>
</g>
<!-- j1819534831&#45;&gt;j3541985483 -->
