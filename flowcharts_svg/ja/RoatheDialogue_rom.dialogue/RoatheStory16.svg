<!-- j1819534831 -->
<g id="node8" class="node">
<title>j1819534831</title>
<polygon fill="none" stroke="blue" points="1217.12,-416.5 118.88,-416.5 118.88,-380.5 1217.12,-380.5 1217.12,-416.5"/>
<text xml:space="preserve" text-anchor="middle" x="668" y="-393.82" font-family="Times New Roman,serif" font-size="14.00">Maryna。お前は我に肉体を捧げた。あの塹壕で、我々は共にクバを飲んだ。手は震え、喉は裂け血が溢れていたが、飲み込めるだけの滴を残しておいた。</text>
</g>
