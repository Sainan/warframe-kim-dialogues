<g id="node7" class="node">
<title>j2522850283</title>
<polygon fill="none" stroke="blue" points="943.75,-489.5 392.25,-489.5 392.25,-453.5 943.75,-453.5 943.75,-489.5"/>
<text xml:space="preserve" text-anchor="middle" x="668" y="-466.07" font-family="Times New Roman,serif" font-size="14.00">お前は上官のために命を捧げた。お前の無私さは我の無力さを痛感させた。</text>
</g>
