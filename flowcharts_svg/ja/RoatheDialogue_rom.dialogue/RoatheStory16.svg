<g id="node9" class="node">
<title>j3541985483</title>
<polygon fill="none" stroke="blue" points="1266.62,-328 69.38,-328 69.38,-292 1266.62,-292 1266.62,-328"/>
<text xml:space="preserve" text-anchor="middle" x="668" y="-304.57" font-family="Times New Roman,serif" font-size="14.00">お前の最後の敬礼を覚えている。途絶えるあの瞬間を。それから瞬きをして、お前のものだった目を開けると、泥の中に横たわる、内臓を抜かれた我の死体が見えた。</text>
</g>
