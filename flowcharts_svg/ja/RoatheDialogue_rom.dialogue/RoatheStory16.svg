<!-- j1893926517 -->
<g id="node6" class="node">
<title>j1893926517</title>
<polygon fill="none" stroke="blue" points="1281.62,-562.5 54.38,-562.5 54.38,-526.5 1281.62,-526.5 1281.62,-562.5"/>
<text xml:space="preserve" text-anchor="middle" x="668" y="-539.83" font-family="Times New Roman,serif" font-size="14.00">Traivon。お前が乗るレールジャックをPraghasaの口に投げ込むのを見た。お前とその部下を貪欲に食らうのに気を取られ、Praghasaは我の船が逃げていくのに気づかなかった。</text>
</g>
<!-- j3430542801&#45;&gt;j1893926517 -->
