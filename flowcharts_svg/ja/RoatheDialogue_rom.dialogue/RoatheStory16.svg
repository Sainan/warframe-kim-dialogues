<!-- 5714 -->
<g id="node9" class="node">
<title>5714</title>
<polygon fill="none" stroke="blue" points="1190,-474 92,-474 92,-438 1190,-438 1190,-474"/>
<text text-anchor="middle" x="641" y="-452.3" font-family="Times New Roman,serif" font-size="14.00">Maryna。お前は我に肉体を捧げた。あの塹壕で、我々は共にクバを飲んだ。手は震え、喉は裂け血が溢れていたが、飲み込めるだけの滴を残しておいた。</text>
</g>
