<!-- 2278 -->
<g id="node10" class="node">
<title>2278</title>
<polygon fill="none" stroke="blue" points="1240,-401 42,-401 42,-365 1240,-365 1240,-401"/>
<text text-anchor="middle" x="641" y="-379.3" font-family="Times New Roman,serif" font-size="14.00">お前の最後の敬礼を覚えている。途絶えるあの瞬間を。それから瞬きをして、お前のものだった目を開けると、泥の中に横たわる、内臓を抜かれた我の死体が見えた。</text>
</g>
