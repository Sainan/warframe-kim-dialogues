<!-- j2522850283 -->
<g id="node7" class="node">
<title>j2522850283</title>
<polygon fill="none" stroke="blue" points="945,-488 393,-488 393,-452 945,-452 945,-488"/>
<text text-anchor="middle" x="669" y="-466.3" font-family="Times New Roman,serif" font-size="14.00">お前は上官のために命を捧げた。お前の無私さは我の無力さを痛感させた。</text>
</g>
<!-- j1893926517&#45;&gt;j2522850283 -->
<g id="edge7" class="edge">
<title>j1893926517&#45;&gt;j2522850283</title>
