<!-- j1819534831 -->
<g id="node8" class="node">
<title>j1819534831</title>
<polygon fill="none" stroke="blue" points="1218,-415 120,-415 120,-379 1218,-379 1218,-415"/>
<text text-anchor="middle" x="669" y="-393.3" font-family="Times New Roman,serif" font-size="14.00">Maryna。お前は我に肉体を捧げた。あの塹壕で、我々は共にクバを飲んだ。手は震え、喉は裂け血が溢れていたが、飲み込めるだけの滴を残しておいた。</text>
</g>
<!-- j2522850283&#45;&gt;j1819534831 -->
<g id="edge8" class="edge">
<title>j2522850283&#45;&gt;j1819534831</title>
<path fill="none" stroke="black" d="M669,-451.81C669,-444.23 669,-435.1 669,-426.54"/>
