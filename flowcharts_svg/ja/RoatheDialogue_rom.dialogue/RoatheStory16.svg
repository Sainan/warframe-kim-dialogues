<g id="node8" class="node">
<title>5713</title>
<polygon fill="none" stroke="blue" points="917,-547 365,-547 365,-511 917,-511 917,-547"/>
<text text-anchor="middle" x="641" y="-525.3" font-family="Times New Roman,serif" font-size="14.00">お前は上官のために命を捧げた。お前の無私さは我の無力さを痛感させた。</text>
</g>
