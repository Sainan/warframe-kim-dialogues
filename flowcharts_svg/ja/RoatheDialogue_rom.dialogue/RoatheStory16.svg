<text text-anchor="middle" x="641" y="-306.3" font-family="Times New Roman,serif" font-size="14.00">Rostig。お前は失敗作のクローンだと、皆が言っていた。でなければ、グリニアが焼かれながらも戦い続ける理由がないと。ネズミでさえより優れた自己保存能力を持っていると。</text>
