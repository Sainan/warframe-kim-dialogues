<!-- j1893926517 -->
<g id="node6" class="node">
<title>j1893926517</title>
<polygon fill="none" stroke="blue" points="1285,-561 53,-561 53,-525 1285,-525 1285,-561"/>
<text text-anchor="middle" x="669" y="-539.3" font-family="Times New Roman,serif" font-size="14.00">Traivon。お前が乗るレールジャックをPraghasaの口に投げ込むのを見た。お前とその部下を貪欲に食らうのに気を取られ、Praghasaは我の船が逃げていくのに気づかなかった。</text>
</g>
<!-- j3430542801&#45;&gt;j1893926517 -->
<g id="edge6" class="edge">
