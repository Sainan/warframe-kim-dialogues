<polygon fill="none" stroke="blue" points="1307.88,-255 28.12,-255 28.12,-219 1307.88,-219 1307.88,-255"/>
<text xml:space="preserve" text-anchor="middle" x="668" y="-232.32" font-family="Times New Roman,serif" font-size="14.00">Rostig。お前は失敗作のクローンだと、皆が言っていた。でなければ、グリニアが焼かれながらも戦い続ける理由がないと。ネズミでさえより優れた自己保存能力を持っていると。</text>
</g>
