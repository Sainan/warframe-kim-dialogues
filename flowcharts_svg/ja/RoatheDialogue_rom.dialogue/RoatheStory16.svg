<!-- j2747524371 -->
<g id="node10" class="node">
<title>j2747524371</title>
<polygon fill="none" stroke="blue" points="1310,-255 28,-255 28,-219 1310,-219 1310,-255"/>
<text text-anchor="middle" x="669" y="-233.3" font-family="Times New Roman,serif" font-size="14.00">Rostig。お前は失敗作のクローンだと、皆が言っていた。でなければ、グリニアが焼かれながらも戦い続ける理由がないと。ネズミでさえより優れた自己保存能力を持っていると。</text>
</g>
