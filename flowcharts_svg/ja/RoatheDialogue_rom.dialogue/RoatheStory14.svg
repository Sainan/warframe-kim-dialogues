<polygon fill="none" stroke="blue" points="1494,-488 28,-488 28,-452 1494,-452 1494,-488"/>
<text text-anchor="middle" x="761" y="-466.3" font-family="Times New Roman,serif" font-size="14.00">センティエントの多くは遭遇ごとに進化を遂げたため、同じ敵に二度遭遇するかどうかは不確定だった。しかし、中にはまるで頂点に達したかのように、一定の形態を保ったままのセンティエントもいた。</text>
</g>
