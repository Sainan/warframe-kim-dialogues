<text text-anchor="middle" x="679.5" y="-734.3" font-family="Times New Roman,serif" font-size="14.00">Jestem Sœur Marie Leroux, ale możesz mówić mi Maria. Niedawno pojawiłam się tutaj wraz z bratem mojej duszy, Ojcem Leonem Allardem i... myślę, że Monsieur Loid już ostrzegł cię przed diabłem, n&#39;est&#45;ce pas ?</text>
