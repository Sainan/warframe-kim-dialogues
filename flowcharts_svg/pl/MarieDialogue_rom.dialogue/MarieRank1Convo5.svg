<text text-anchor="middle" x="679.5" y="-878.3" font-family="Times New Roman,serif" font-size="14.00">Bonjour, bonjour ! Musisz być Włóczęgą, oui ? Monsieur Loid tyle mi o tobie opowiadał. Bardzo się cieszę, że mogę cię &quot;poznać&quot; na tym...</text>
