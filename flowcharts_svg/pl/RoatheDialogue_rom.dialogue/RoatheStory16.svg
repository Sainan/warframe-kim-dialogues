<polygon fill="none" stroke="blue" points="929,-401 161,-401 161,-365 929,-365 929,-401"/>
<text text-anchor="middle" x="545" y="-379.3" font-family="Times New Roman,serif" font-size="14.00">I remember your last salute. The fading. Then I blinked open the eyes that had been yours, and saw my gutted corpse dead in the mud.</text>
