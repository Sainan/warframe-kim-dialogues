<g id="node10" class="node">
<title>j1926271240</title>
<polygon fill="none" stroke="blue" points="1118,-255 28,-255 28,-219 1118,-219 1118,-255"/>
<text text-anchor="middle" x="573" y="-233.3" font-family="Times New Roman,serif" font-size="14.00">Rostig. Coś nie tak z procesem klonowania, mówili. Co innego mogłoby sprawić, że Grineer pozostałby przy swojej wieżyczce, płonąc żywcem? Nawet szczur ma instynkt samozachowawczy!</text>
</g>
