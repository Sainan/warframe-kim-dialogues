<text text-anchor="middle" x="545" y="-598.3" font-family="Times New Roman,serif" font-size="14.00">Traivon. Widziałem, jak cisnęłaś swojego Railjacka w paszczę Praghasy. Rozproszona, żarłocznie karmiąc się tobą i twoimi ludźmi, nie zauważyła, że mój statek ucieka.</text>
</g>
