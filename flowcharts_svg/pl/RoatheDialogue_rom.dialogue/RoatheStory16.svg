<!-- j3725952612 -->
<g id="node9" class="node">
<title>j3725952612</title>
<polygon fill="none" stroke="blue" points="957,-328 189,-328 189,-292 957,-292 957,-328"/>
<text text-anchor="middle" x="573" y="-306.3" font-family="Times New Roman,serif" font-size="14.00">I remember your last salute. The fading. Then I blinked open the eyes that had been yours, and saw my gutted corpse dead in the mud.</text>
</g>
<!-- j3496723491&#45;&gt;j3725952612 -->
<g id="edge9" class="edge">
<title>j3496723491&#45;&gt;j3725952612</title>
