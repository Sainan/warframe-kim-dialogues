<!-- j3729277252 -->
<g id="node7" class="node">
<title>j3729277252</title>
<polygon fill="none" stroke="blue" points="844,-488 302,-488 302,-452 844,-452 844,-488"/>
<text text-anchor="middle" x="573" y="-466.3" font-family="Times New Roman,serif" font-size="14.00">You laid down your life for your superior officer. I felt your selflessness like a slap in the face.</text>
</g>
<!-- j1877281627&#45;&gt;j3729277252 -->
<g id="edge7" class="edge">
<title>j1877281627&#45;&gt;j3729277252</title>
<path fill="none" stroke="black" d="M573,-524.81C573,-517.23 573,-508.1 573,-499.54"/>
<polygon fill="black" stroke="black" points="576.5,-499.54 573,-489.54 569.5,-499.54 576.5,-499.54"/>
</g>
<!-- j3496723491 -->
<g id="node8" class="node">
<title>j3496723491</title>
<polygon fill="none" stroke="blue" points="1047,-415 99,-415 99,-379 1047,-379 1047,-415"/>
<text text-anchor="middle" x="573" y="-393.3" font-family="Times New Roman,serif" font-size="14.00">Maryna. You gave me your body. Together, in that trench, we drank Kuva. My hands shook and my gashed throat leaked, but I kept enough drops down for it to take.</text>
</g>
<!-- j3729277252&#45;&gt;j3496723491 -->
<g id="edge8" class="edge">
<title>j3729277252&#45;&gt;j3496723491</title>
<path fill="none" stroke="black" d="M573,-451.81C573,-444.23 573,-435.1 573,-426.54"/>
<polygon fill="black" stroke="black" points="576.5,-426.54 573,-416.54 569.5,-426.54 576.5,-426.54"/>
