<!-- 5714 -->
<g id="node9" class="node">
<title>5714</title>
<polygon fill="none" stroke="blue" points="1019,-474 71,-474 71,-438 1019,-438 1019,-474"/>
<text text-anchor="middle" x="545" y="-452.3" font-family="Times New Roman,serif" font-size="14.00">Maryna. You gave me your body. Together, in that trench, we drank Kuva. My hands shook and my gashed throat leaked, but I kept enough drops down for it to take.</text>
</g>
