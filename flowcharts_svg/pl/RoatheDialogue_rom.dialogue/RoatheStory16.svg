<!-- j1877281627 -->
<g id="node6" class="node">
<title>j1877281627</title>
<polygon fill="none" stroke="blue" points="1089,-561 57,-561 57,-525 1089,-525 1089,-561"/>
<text text-anchor="middle" x="573" y="-539.3" font-family="Times New Roman,serif" font-size="14.00">Transkrypcja: Traivon. Widziałem, jak cisnęłaś swojego Railjacka w paszczę Praghasy. Rozproszona, żarłocznie karmiąc się tobą i twoimi ludźmi, nie zauważyła, że mój statek ucieka.</text>
</g>
