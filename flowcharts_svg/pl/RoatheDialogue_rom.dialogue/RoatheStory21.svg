<text text-anchor="middle" x="593" y="-612.3" font-family="Times New Roman,serif" font-size="14.00">Teraz sobie przypominam. Podszedł do mnie w Złotych Salach. Miał twarz, której nie znałem. Ale to nie jest takie niezwykłe dla naszego rodzaju. Znałem jego głos. Znałem sposób, w jaki się poruszał.</text>
