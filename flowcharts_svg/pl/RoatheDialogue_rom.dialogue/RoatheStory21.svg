<text text-anchor="middle" x="593" y="-758.3" font-family="Times New Roman,serif" font-size="14.00">Właśnie mnie tak nazywali, prawda? Czytałem książki rozrzucone po tej zakurzonej sali. Kłamstwo. Nie znali prawdy. Zostałem wyrwany z mojego czasu, zanim udało mi się dokończyć swoje dzieło.</text>
