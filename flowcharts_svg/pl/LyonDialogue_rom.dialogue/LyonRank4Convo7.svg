<text text-anchor="middle" x="653" y="-662.3" font-family="Times New Roman,serif" font-size="14.00">Nie wiem, jak to opisać. To trochę tak, jakbym... próbował coś chwycić, a widział jedynie, jak kawałki pyłu przelatują mi przez palce. </text>
</g>
