<text text-anchor="middle" x="653" y="-590.3" font-family="Times New Roman,serif" font-size="14.00">Często czuję się, jakbym był pustym kawałkiem płótna, rozmazującym farbę olejną na jego powierzchni... bezskutecznie próbując stworzyć zarys obrazu, który dostrzegam oczyma wyobraźni.</text>
</g>
