<text text-anchor="middle" x="619" y="-734.3" font-family="Times New Roman,serif" font-size="14.00">Soy sor Marie Leroux, pero pueden llamarme Marie. Hace poco vine aquí con mi hermano del alma, el padre Lyon Allard, y... bueno, creo que Monsieur Loid te advirtió del diablo, n&#39;est&#45;ce pas ?</text>
</g>
