<text xml:space="preserve" text-anchor="middle" x="611" y="-876.95" font-family="Times New Roman,serif" font-size="14.00">Bonjour, bonjour ! Debes ser el Viajero, oui ? Monsieur Loid me ha hablado muchísimo de ti. Me alegra mucho &quot;conocerte&quot; en este...</text>
