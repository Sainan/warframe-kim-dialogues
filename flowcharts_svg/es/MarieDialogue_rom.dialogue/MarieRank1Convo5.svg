<text text-anchor="middle" x="1860" y="-518.3" font-family="Times New Roman,serif" font-size="14.00">Oui, ese monstruo irritante de piel azul que nos encomedó el Cardenal. Creo que lo conoces como Albrecht Entrati. Él es la razón por la que estamos aquí. Pero esa es una larga historia, j&#39;en ai bien peur.</text>
