<text text-anchor="middle" x="619" y="-518.3" font-family="Times New Roman,serif" font-size="14.00">Merci ! El porqué y el cómo de nuestra llegada es una historia muy larga, j&#39;en ai bien peur. Nos envió le Cardinal. Creo que lo conoces como Albrecht Entrati. Nos encomendó a ese monstre irritant de piel azul.</text>
