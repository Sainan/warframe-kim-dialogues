<text xml:space="preserve" text-anchor="middle" x="611" y="-732.95" font-family="Times New Roman,serif" font-size="14.00">Soy sor Marie Leroux, pero pueden llamarme Marie. Hace poco vine aquí con mi hermano del alma, el padre Lyon Allard, y... bueno, creo que Monsieur Loid te advirtió del diablo, n&#39;est&#45;ce pas ?</text>
