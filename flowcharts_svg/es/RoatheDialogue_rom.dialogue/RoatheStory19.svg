<text text-anchor="middle" x="491.84" y="-379.3" font-family="Times New Roman,serif" font-size="14.00">La facción belicista, liderada por Nitokh, disparó desde un lado. Los pacifistas, bajo el liderazgo de Scarne, dispararon desde el otro.</text>
</g>
