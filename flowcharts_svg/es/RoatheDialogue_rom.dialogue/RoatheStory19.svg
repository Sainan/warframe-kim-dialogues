<text xml:space="preserve" text-anchor="middle" x="513.71" y="-377.95" font-family="Times New Roman,serif" font-size="14.00">La facción belicista, liderada por Nitokh, disparó desde un lado. Los pacifistas, bajo el liderazgo de Scarne, dispararon desde el otro.</text>
