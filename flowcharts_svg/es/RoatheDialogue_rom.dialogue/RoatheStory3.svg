<text text-anchor="middle" x="660" y="-393.3" font-family="Times New Roman,serif" font-size="14.00">Transcripción: Durante mucho tiempo, el Imperio orokin no tuvo enemigos. Su ejército sólo existía para satisfacer pequeñas rencillas, casa contra casa, ejecutor contra ejecutor.</text>
</g>
