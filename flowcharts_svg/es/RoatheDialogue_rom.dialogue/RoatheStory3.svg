<text text-anchor="middle" x="660" y="-233.3" font-family="Times New Roman,serif" font-size="14.00">Los Emperadores, los gobernantes inmortales del imperio, cuyo poder residía en los ejecutores, despertaron tambaleándose en sus polvorientos tronos dorados.</text>
