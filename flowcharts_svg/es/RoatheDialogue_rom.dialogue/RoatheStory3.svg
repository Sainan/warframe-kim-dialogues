<text text-anchor="middle" x="660" y="-320.3" font-family="Times New Roman,serif" font-size="14.00">Cuando los conscientes atacaron, descubrimos una unidad que nos había sido negada durante mucho tiempo. Los Dax desenvainaron sus espadas contra algo mucho más que un granjero desafiante o un comerciante ladrón.</text>
