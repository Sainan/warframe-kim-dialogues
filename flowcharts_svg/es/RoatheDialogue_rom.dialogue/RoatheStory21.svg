<text text-anchor="middle" x="583" y="-758.3" font-family="Times New Roman,serif" font-size="14.00">Así me llamaban, ¿verdad? He leído los libros de historia esparcidos por este polvoriento salón. Mentira. No sabían la verdad. Que me arrebataron de mi tiempo antes de poder completar mi obra.</text>
