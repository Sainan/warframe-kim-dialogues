<text xml:space="preserve" text-anchor="middle" x="572" y="-612.45" font-family="Times New Roman,serif" font-size="14.00">Ahora lo recuerdo. Se me acercó en los Salones Dorados. Tenía un rostro que no conocía. Pero eso no es tan inusual en nuestra especie. Conocía su voz. Conocía su forma de moverse.</text>
