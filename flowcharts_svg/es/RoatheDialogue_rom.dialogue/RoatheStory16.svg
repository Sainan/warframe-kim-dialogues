<text text-anchor="middle" x="580" y="-393.3" font-family="Times New Roman,serif" font-size="14.00">Maryna. Me diste tu cuerpo. Juntos, en esa trinchera, bebimos Kuva. Me temblaban las manos y mi garganta herida supuraba, pero contuve suficientes gotas para que aguantara.</text>
</g>
