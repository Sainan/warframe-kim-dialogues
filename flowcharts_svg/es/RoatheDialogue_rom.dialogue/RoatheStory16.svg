<text text-anchor="middle" x="580" y="-539.3" font-family="Times New Roman,serif" font-size="14.00">Transcripción: Traivon. Te vi arrojar tu Railjack a las fauces de Praghasa. Distraída, alimentándose con avidez de ti y de tus hombres, no se dio cuenta de que mi nave se alejaba a toda velocidad.</text>
