<text xml:space="preserve" text-anchor="middle" x="733" y="-304.95" font-family="Times New Roman,serif" font-size="14.00">Como uno solo, los Siete me ordenaron convertirme en un diablo con un tridente de ojivas, un sembrador con una bolsa de radiación desenfrenada.</text>
