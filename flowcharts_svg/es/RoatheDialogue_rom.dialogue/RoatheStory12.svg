<text text-anchor="middle" x="757" y="-306.3" font-family="Times New Roman,serif" font-size="14.00">Como uno solo, los Siete me ordenaron convertirme en un diablo con un tridente de ojivas, un sembrador con una bolsa de radiación desenfrenada.</text>
</g>
