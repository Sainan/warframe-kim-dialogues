<text text-anchor="middle" x="757" y="-393.3" font-family="Times New Roman,serif" font-size="14.00">¿Cómo controlamos la Infestación en tiempos de nuestros antepasados? ¡Abriendo el corazón del átomo como un capullo de rosa, por supuesto!</text>
