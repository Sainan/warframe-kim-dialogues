<text text-anchor="middle" x="605.29" y="-306.3" font-family="Times New Roman,serif" font-size="14.00">Lo usé con más frecuencia contra mis propias tropas. Los torturé hasta la médula con mentiras sobre el deber y la disciplina.</text>
