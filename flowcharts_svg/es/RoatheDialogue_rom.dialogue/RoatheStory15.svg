<text text-anchor="middle" x="605.29" y="-233.3" font-family="Times New Roman,serif" font-size="14.00">Los sofoqué con la mentira de que la guerra podía ganarse. Los atravesé con la mentira de mi favor, mi más preciado aprecio por ellos.</text>
