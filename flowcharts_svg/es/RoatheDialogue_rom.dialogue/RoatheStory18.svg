<text xml:space="preserve" text-anchor="middle" x="487.1" y="-393.45" font-family="Times New Roman,serif" font-size="14.00">La ejecutora Nitokh estaba disgustada. Había esperado una gloriosa escalada, batalla tras batalla, que culminaría en el éxtasis culminante de la muerte de los orokin.</text>
