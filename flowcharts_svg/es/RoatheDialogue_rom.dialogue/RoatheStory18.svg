<text text-anchor="middle" x="492" y="-393.3" font-family="Times New Roman,serif" font-size="14.00">La ejecutora Nitokh estaba disgustada. Había esperado una gloriosa escalada, batalla tras batalla, que culminaría en el éxtasis culminante de la muerte de los orokin.</text>
</g>
