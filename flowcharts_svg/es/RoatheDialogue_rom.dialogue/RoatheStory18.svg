<text text-anchor="middle" x="492" y="-306.3" font-family="Times New Roman,serif" font-size="14.00">Después de lo cual saldría de su escondite y… bueno, ahí me queda especular. Quizás esperaba que la invitaran a compartir la confianza de los conscientes.</text>
</g>
