<text text-anchor="middle" x="537" y="-233.3" font-family="Times New Roman,serif" font-size="14.00">Los warframes habían aparecido del cielo, con forma de ángeles, liberando cautivos y devastando fortalezas conscientes. Solos, eran milagros, y en grupos, eran dioses.</text>
