<text text-anchor="middle" x="537" y="-466.3" font-family="Times New Roman,serif" font-size="14.00">La guerra estaba prácticamente perdida; los conscientes eran invencibles; creemos, entonces, estos guerreros extraños y surrealistas y armémoslos con armas de un linaje ancestral.</text>
