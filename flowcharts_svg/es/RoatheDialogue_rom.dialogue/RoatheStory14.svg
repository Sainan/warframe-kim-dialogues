<text xml:space="preserve" text-anchor="middle" x="753" y="-304.95" font-family="Times New Roman,serif" font-size="14.00">Era una locura. ¿Cómo podía planear estrategias para contrarrestar el comportamiento de las naves conscientes, si apenas había perfeccionado mis tácticas y ya estaban reemplazando sus naves por naves gusano?</text>
