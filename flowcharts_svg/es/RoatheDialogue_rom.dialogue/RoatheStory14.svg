<text text-anchor="middle" x="771" y="-233.3" font-family="Times New Roman,serif" font-size="14.00">¿Y cuánto tiempo pasaría antes de que esas naves gusano fueran reemplazadas por alguna nueva monstruosidad?</text>
</g>
