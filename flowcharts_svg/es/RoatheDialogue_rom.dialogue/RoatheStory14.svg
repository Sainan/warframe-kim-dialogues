<text xml:space="preserve" text-anchor="middle" x="753" y="-466.45" font-family="Times New Roman,serif" font-size="14.00">Transcripción: Muchos conscientes evolucionaron entre encuentros, por lo que nunca podíamos estar seguros de enfrentarnos al mismo enemigo dos veces. Pero otros se mantuvieron en forma constante, como si hubieran alcanzado un punto hace mucho tiempo.</text>
