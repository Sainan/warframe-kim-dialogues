<g id="node7" class="node">
<title>j3947995437</title>
<polygon fill="none" stroke="blue" points="992.5,-415 549.5,-415 549.5,-379 992.5,-379 992.5,-415"/>
<text text-anchor="middle" x="771" y="-393.3" font-family="Times New Roman,serif" font-size="14.00">Asesinos perfectos, inspiraban el mismo horror escalofriante que un tiburón.</text>
</g>
