<polygon fill="none" stroke="blue" points="1514,-488 28,-488 28,-452 1514,-452 1514,-488"/>
<text text-anchor="middle" x="771" y="-466.3" font-family="Times New Roman,serif" font-size="14.00">Transcripción: Muchos conscientes evolucionaron entre encuentros, por lo que nunca podíamos estar seguros de enfrentarnos al mismo enemigo dos veces. Pero otros se mantuvieron en forma constante, como si hubieran alcanzado un punto hace mucho tiempo.</text>
</g>
