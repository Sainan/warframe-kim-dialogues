<g id="node8" class="node">
<title>j3078916612</title>
<polygon fill="none" stroke="blue" points="1372.5,-328 169.5,-328 169.5,-292 1372.5,-292 1372.5,-328"/>
<text text-anchor="middle" x="771" y="-306.3" font-family="Times New Roman,serif" font-size="14.00">Era una locura. ¿Cómo podía planear estrategias para contrarrestar el comportamiento de las naves conscientes, si apenas había perfeccionado mis tácticas y ya estaban reemplazando sus naves por naves gusano?</text>
</g>
