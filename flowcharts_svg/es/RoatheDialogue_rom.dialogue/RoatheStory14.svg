<text text-anchor="middle" x="771" y="-160.3" font-family="Times New Roman,serif" font-size="14.00">Todo lo que podíamos hacer era retroceder. El progreso había sido fatal. Las viejas tradiciones, los caminos consagrados por el tiempo, de honor y disciplina, merecían su merecido.</text>
