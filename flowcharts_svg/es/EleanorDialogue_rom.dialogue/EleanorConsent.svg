<text text-anchor="middle" x="555" y="-612.3" font-family="Times New Roman,serif" font-size="14.00">Te respondo, muy malhumorada y con los brazos cruzados, con un &quot;sí, por supuesto&quot;, mientras me siento aquí sin pensar en ti disfrutando de esa belleza que vislumbré en tus fantasías.</text>
