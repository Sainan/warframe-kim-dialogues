<text xml:space="preserve" text-anchor="middle" x="522.38" y="-660.95" font-family="Times New Roman,serif" font-size="14.00">No sé cómo describirlo, salvo que es como si estuviera tratando de alcanzar algo y sólo puedo ver polvo deslizarse entre mis dedos. </text>
