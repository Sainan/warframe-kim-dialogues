<text text-anchor="middle" x="534.5" y="-590.3" font-family="Times New Roman,serif" font-size="14.00">A menudo me siento como si fuera un lienzo vacío, manchado con pintura al óleo, intentando inútilmente crear la sombra de una imagen que puedo ver con mi mente.</text>
</g>
