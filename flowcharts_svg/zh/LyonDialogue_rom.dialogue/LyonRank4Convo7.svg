<text text-anchor="middle" x="567" y="-734.3" font-family="Times New Roman,serif" font-size="14.00">对我来说，交流很困难。尤其是在亲密的交流中，这种困难远比在冷冰冰、机械式的交流或书信往来中要严重得多。</text>
