<text text-anchor="middle" x="567" y="-662.3" font-family="Times New Roman,serif" font-size="14.00">我不知道该如何形容——只能说……就像我拼命想抓住什么东西，却眼睁睁地看着灰尘从指缝间溜走。 </text>
