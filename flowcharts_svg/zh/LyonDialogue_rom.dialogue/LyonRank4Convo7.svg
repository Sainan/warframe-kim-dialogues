<text xml:space="preserve" text-anchor="middle" x="565.5" y="-589.33" font-family="Times New Roman,serif" font-size="14.00">我常常觉得自己像一张空白的画布，在上面涂抹油彩——徒劳地试图勾勒出我脑海中所见图像的轮廓。</text>
</g>
