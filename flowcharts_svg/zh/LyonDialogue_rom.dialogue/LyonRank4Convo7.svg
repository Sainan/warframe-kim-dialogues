<text text-anchor="middle" x="567" y="-590.3" font-family="Times New Roman,serif" font-size="14.00">我常常觉得自己像一张空白的画布，在上面涂抹油彩——徒劳地试图勾勒出我脑海中所见图像的轮廓。</text>
</g>
