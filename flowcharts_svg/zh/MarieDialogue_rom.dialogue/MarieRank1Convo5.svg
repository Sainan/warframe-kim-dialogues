<text text-anchor="middle" x="661.5" y="-734.3" font-family="Times New Roman,serif" font-size="14.00">我是玛丽·勒鲁修女，不过你可以叫我玛丽。我最近和我的灵魂兄弟里昂·阿拉德神父一起来到这里……嗯，我想洛德先生可能已经警告过你恶魔的存在了，n&#39;est&#45;ce pas ？</text>
</g>
