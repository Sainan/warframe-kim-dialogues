<text text-anchor="middle" x="662" y="-452.3" font-family="Times New Roman,serif" font-size="14.00">玛丽娜，你把你的身体给了我。在那条战壕里，我们一起喝下赤毒。我的手颤抖着，被割破的喉咙鲜血直流，但我还是努力咽下了几滴，让它发挥作用。</text>
