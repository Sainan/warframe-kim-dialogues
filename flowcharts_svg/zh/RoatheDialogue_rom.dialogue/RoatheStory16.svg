<text text-anchor="middle" x="690" y="-306.3" font-family="Times New Roman,serif" font-size="14.00">我记得你最后一次敬礼。那道逐渐消逝的身影。然后我睁开了曾属于你的眼睛，看到自己被开膛破肚的尸体躺在泥泞里。</text>
