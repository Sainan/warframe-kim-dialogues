<g id="node6" class="node">
<title>j1332346338</title>
<polygon fill="none" stroke="blue" points="1352,-561 28,-561 28,-525 1352,-525 1352,-561"/>
<text text-anchor="middle" x="690" y="-539.3" font-family="Times New Roman,serif" font-size="14.00">文字记录：特雷文。我亲眼看着你驾驶着你的航道星舰冲进了布拉喀萨的巨口。她当时正忙着贪婪地吞噬你和你的部下，根本没注意到我的飞船已经疾驰而去。你为了你的上级献出了生命。</text>
</g>
