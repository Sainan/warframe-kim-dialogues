<polygon fill="none" stroke="blue" points="715.74,-488 257.74,-488 257.74,-452 715.74,-452 715.74,-488"/>
<text text-anchor="middle" x="486.74" y="-466.3" font-family="Times New Roman,serif" font-size="14.00">跳进去吧，她的眼睛闪烁着某种宇宙级玩笑般的喜悦，对我说。</text>
</g>
<!-- j1997250375&#45;&gt;j1655499864 -->
<g id="edge8" class="edge">
<title>j1997250375&#45;&gt;j1655499864</title>
<path fill="none" stroke="black" d="M486.74,-524.81C486.74,-517.23 486.74,-508.1 486.74,-499.54"/>
