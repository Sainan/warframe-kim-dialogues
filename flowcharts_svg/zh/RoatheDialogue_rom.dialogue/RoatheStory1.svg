<g id="node9" class="node">
<title>j1038087607</title>
<polygon fill="none" stroke="blue" points="723.24,-401 250.24,-401 250.24,-365 723.24,-365 723.24,-401"/>
<text text-anchor="middle" x="486.74" y="-379.3" font-family="Times New Roman,serif" font-size="14.00">透过她疯狂的幻象，我得以逃离奥罗金人漫长而黯淡的停滞生活。</text>
</g>
<!-- j1655499864&#45;&gt;j1038087607 -->
<g id="edge9" class="edge">
<title>j1655499864&#45;&gt;j1038087607</title>
