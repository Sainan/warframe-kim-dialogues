<polygon fill="none" stroke="blue" points="735,-489.5 278,-489.5 278,-453.5 735,-453.5 735,-489.5"/>
<text xml:space="preserve" text-anchor="middle" x="506.5" y="-466.07" font-family="Times New Roman,serif" font-size="14.00">跳进去吧，她的眼睛闪烁着某种宇宙级玩笑般的喜悦，对我说。</text>
</g>
