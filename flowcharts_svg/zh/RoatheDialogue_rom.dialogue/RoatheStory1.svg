<text xml:space="preserve" text-anchor="middle" x="506.5" y="-231.57" font-family="Times New Roman,serif" font-size="14.00">永恒不灭，她的贪婪无止境。一天晚上，她叫我去她浴室。我迈着大步走过香水和鲜血交织的水洼，恭敬地立正站好。</text>
</g>
