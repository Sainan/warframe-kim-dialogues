<text xml:space="preserve" text-anchor="middle" x="506.5" y="-304.57" font-family="Times New Roman,serif" font-size="14.00">几个世纪前，我们所有的感官都麻木不仁。然而，她依然以她独特的方式，鲜活如初。</text>
</g>
