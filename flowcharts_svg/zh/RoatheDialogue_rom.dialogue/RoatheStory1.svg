<polygon fill="none" stroke="blue" points="733.5,-562.5 279.5,-562.5 279.5,-526.5 733.5,-526.5 733.5,-562.5"/>
<text xml:space="preserve" text-anchor="middle" x="506.5" y="-539.83" font-family="Times New Roman,serif" font-size="14.00">你总能清楚地知道自己和她在一起的处境——就在深渊的边缘。</text>
</g>
