<polygon fill="none" stroke="blue" points="742.87,-401 270.12,-401 270.12,-365 742.87,-365 742.87,-401"/>
<text xml:space="preserve" text-anchor="middle" x="506.5" y="-377.57" font-family="Times New Roman,serif" font-size="14.00">透过她疯狂的幻象，我得以逃离奥罗金人漫长而黯淡的停滞生活。</text>
</g>
