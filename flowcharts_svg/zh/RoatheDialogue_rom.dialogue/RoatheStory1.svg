<!-- j1997250375 -->
<g id="node7" class="node">
<title>j1997250375</title>
<polygon fill="none" stroke="blue" points="714.24,-561 259.24,-561 259.24,-525 714.24,-525 714.24,-561"/>
<text text-anchor="middle" x="486.74" y="-539.3" font-family="Times New Roman,serif" font-size="14.00">你总能清楚地知道自己和她在一起的处境——就在深渊的边缘。</text>
</g>
