<title>j2188651267</title>
<polygon fill="none" stroke="blue" points="1392,-488 28,-488 28,-452 1392,-452 1392,-488"/>
<text text-anchor="middle" x="710" y="-466.3" font-family="Times New Roman,serif" font-size="14.00">文字记录：许多 Sentient 在每次遭遇战之间都会进化，所以我们永远无法确定下一次面对的还是不是同一种敌人。但也有一些 Sentient 保持着稳定的形态，仿佛它们很久以前就达到了某种巅峰状态。</text>
</g>
