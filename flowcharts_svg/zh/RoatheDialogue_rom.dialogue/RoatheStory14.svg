<polygon fill="none" stroke="blue" points="1130,-328 290,-328 290,-292 1130,-292 1130,-328"/>
<text text-anchor="middle" x="710" y="-306.3" font-family="Times New Roman,serif" font-size="14.00">这简直是疯了。我刚完善了针对 Sentient 的螃蟹飞船的战术，螃蟹飞船就被蠕虫飞船取代了，我该如何制定应对策略呢？</text>
</g>
