<text xml:space="preserve" text-anchor="middle" x="550.71" y="-466.82" font-family="Times New Roman,serif" font-size="14.00">“走狗”，他们叫我“走狗”。尼托自以为一切尽在掌握。其实正是我巧妙地引导了她。</text>
