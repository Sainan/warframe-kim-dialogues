<text text-anchor="middle" x="531.84" y="-379.3" font-family="Times New Roman,serif" font-size="14.00">罗瑟，那个双手沾满鲜血的家伙。罗瑟，那个靠着手下尸体养肥的食人魔。挥霍无度，浪费生命。</text>
</g>
