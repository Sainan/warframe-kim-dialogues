<polygon fill="none" stroke="blue" points="839.34,-561 224.34,-561 224.34,-525 839.34,-525 839.34,-561"/>
<text text-anchor="middle" x="531.84" y="-539.3" font-family="Times New Roman,serif" font-size="14.00">敌人一旦发现你有所退让，对方就会乘胜追击；而这正是你轻易绊倒对方的绝佳机会。</text>
</g>
