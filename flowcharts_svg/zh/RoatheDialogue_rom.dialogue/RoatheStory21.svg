<polygon fill="none" stroke="blue" points="1202.5,-634 51.5,-634 51.5,-598 1202.5,-598 1202.5,-634"/>
<text text-anchor="middle" x="627" y="-612.3" font-family="Times New Roman,serif" font-size="14.00">我现在想起来了。他在金碧辉煌的大厅里向我走来。他戴着一张我不认识的面具。但这对于我们这类人来说并不算什么稀奇事。我认得他的声音。我认得他的举止。</text>
</g>
