<!-- j4107206337 -->
<g id="node7" class="node">
<title>j4107206337</title>
<polygon fill="none" stroke="blue" points="1226,-780 28,-780 28,-744 1226,-744 1226,-780"/>
<text text-anchor="middle" x="627" y="-758.3" font-family="Times New Roman,serif" font-size="14.00">他们都这么叫我，不是吗？我读了那些散落在这座布满灰尘的大厅里的历史书。这是谎言。他们不知道真相。我在完成我的工作之前，就被强行从属于我的时代里夺走了。</text>
</g>
