<polygon fill="none" stroke="blue" points="1225.62,-781.5 28.38,-781.5 28.38,-745.5 1225.62,-745.5 1225.62,-781.5"/>
<text xml:space="preserve" text-anchor="middle" x="627" y="-758.08" font-family="Times New Roman,serif" font-size="14.00">他们都这么叫我，不是吗？我读了那些散落在这座布满灰尘的大厅里的历史书。这是谎言。他们不知道真相。我在完成我的工作之前，就被强行从属于我的时代里夺走了。</text>
</g>
