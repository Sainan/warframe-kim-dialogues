<text xml:space="preserve" text-anchor="middle" x="495" y="-466.82" font-family="Times New Roman,serif" font-size="14.00">战争已经几乎败了；Sentient 不可战胜；那么，让我们创造这些奇异而超现实的战士，并为他们配备古老血统的武器。</text>
