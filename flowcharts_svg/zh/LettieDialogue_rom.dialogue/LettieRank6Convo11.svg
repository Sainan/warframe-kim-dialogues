<text text-anchor="middle" x="341" y="-140.8" font-family="Times New Roman,serif" font-size="14.00">这就是我养小鼠的原因&#13;</text>
<text text-anchor="middle" x="341" y="-125.8" font-family="Times New Roman,serif" font-size="14.00">它们的生命很短暂，但它们永远不会忘记好好生活&#13;</text>
<text text-anchor="middle" x="341" y="-110.8" font-family="Times New Roman,serif" font-size="14.00">从每一块面包屑中找到快乐&#13;</text>
<text text-anchor="middle" x="341" y="-95.8" font-family="Times New Roman,serif" font-size="14.00">并回报给予它们的每一分爱&#13;</text>
<text text-anchor="middle" x="341" y="-80.8" font-family="Times New Roman,serif" font-size="14.00">永远不知道这些会什么时候消失</text>
</g>
