<polygon fill="none" stroke="blue" points="791.5,-713 491.5,-713 491.5,-585 791.5,-585 791.5,-713"/>
<text text-anchor="middle" x="641.5" y="-697.8" font-family="Times New Roman,serif" font-size="14.00">我大部分战友都没挺过来 &#13;</text>
<text text-anchor="middle" x="641.5" y="-682.8" font-family="Times New Roman,serif" font-size="14.00">他的也是&#13;</text>
<text text-anchor="middle" x="641.5" y="-667.8" font-family="Times New Roman,serif" font-size="14.00">我们互相支撑着&#13;</text>
<text text-anchor="middle" x="641.5" y="-652.8" font-family="Times New Roman,serif" font-size="14.00">真的是字面上的支撑 &#13;</text>
<text text-anchor="middle" x="641.5" y="-637.8" font-family="Times New Roman,serif" font-size="14.00">我还帮他把胳膊缝好了，哈哈 &#13;</text>
<text text-anchor="middle" x="641.5" y="-622.8" font-family="Times New Roman,serif" font-size="14.00">当他退役并加入国危部时 &#13;</text>
<text text-anchor="middle" x="641.5" y="-607.8" font-family="Times New Roman,serif" font-size="14.00">我毫不犹豫地跟随他 &#13;</text>
<text text-anchor="middle" x="641.5" y="-592.8" font-family="Times New Roman,serif" font-size="14.00">我早就受够了军队里的那些乱七八糟的事</text>
</g>
