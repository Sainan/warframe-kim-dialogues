<!-- j1124368426 -->
<g id="node8" class="node">
<title>j1124368426</title>
<polygon fill="none" stroke="blue" points="1088,-540 0,-540 0,-504 1088,-504 1088,-540"/>
<text text-anchor="middle" x="544" y="-518.3" font-family="Times New Roman,serif" font-size="14.00">接着第二天，这张照片就到处都是了。校园里的每个人都看到了它。互相分享。发给你的教授。传遍了整个互联网。甚至传到了我都不知道其存在的国家。</text>
</g>
