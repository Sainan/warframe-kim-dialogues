<text text-anchor="middle" x="544" y="-302.3" font-family="Times New Roman,serif" font-size="14.00">但对我来说，它毁了我的生活。我想生活在没有互联网的未来。我想证明我能从这件事中走出来。回到过去就证明他们是对的，我就无法摆脱这件事。</text>
