<text text-anchor="middle" x="647" y="-466.3" font-family="Times New Roman,serif" font-size="14.00">对不起。我真的是来征求你同意的。我知道我们之前没讨论过这件事。我只是想确认这一切你都不会介意。</text>
</g>
