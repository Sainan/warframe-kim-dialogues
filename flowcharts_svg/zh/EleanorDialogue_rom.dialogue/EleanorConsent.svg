<title>j2374956311</title>
<polygon fill="none" stroke="blue" points="1050,-634 28,-634 28,-598 1050,-598 1050,-634"/>
<text text-anchor="middle" x="539" y="-612.3" font-family="Times New Roman,serif" font-size="14.00">答案是一个撅着嘴，双臂交叉地回答“好，当然可以”，而我却只能坐在这里，忍住不想你去和我在你幻想中瞥见的那个美丽尤物寻欢作乐的样子。</text>
</g>
<!-- j2429888828&#45;&gt;j2374956311 -->
<g id="edge11" class="edge">
<title>j2429888828&#45;&gt;j2374956311</title>
