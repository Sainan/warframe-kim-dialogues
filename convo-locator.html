<!DOCTYPE html>
<html>
<head>
	<title>KIM Convo Locator</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://calamity-inc.github.io/Silver/base.css">
</head>
<body>
	<div id="loading">
		<p>Loading, please wait...</p>
	</div>
	<div id="content" class="slv-hidden">
		<input id="query" type="text" placeholder="Enter (part of) a message you want to locate..." />
		<select id="lang">
			<option value="en">English</option>
			<option value="de">Deutsch</option>
			<option value="es">Español</option>
			<option value="fr">Français</option>
			<option value="it">Italiano</option>
			<option value="ja">日本語</option>
			<option value="ko">한국어</option>
			<option value="pl">Polski</option>
			<option value="pt">Português</option>
			<option value="ru">Русский</option>
			<option value="tr">Türkçe</option>
			<option value="uk">Українська</option>
			<option value="zh">简体中文</option>
			<option value="tc">繁體中文</option>
			<option value="th">แบบไทย</option>
		</select>
		<div id="results"></div>
	</div>
</body>
<script>
	if (location.host == "kim.browse.wf" && location.pathname == "/convo-locator.html")
	{
		location.pathname = "/convo-locator";
	}

	const chatroom_to_username = {
		"AoiDialogue_rom.dialogue": "xX GLIMMER Xx",
		"ArthurDialogue_rom.dialogue": "Broadsword",
		"EleanorDialogue_rom.dialogue": "Salem",
		"FlareDialogue_rom.dialogue": "Liminus_Star",
		"HexDialogue_rom.dialogue": "The Hex",
		"JabirDialogue_rom.dialogue": "H16h V0l7463",
		"KayaDialogue_rom.dialogue": "KOLTrial_5115",
		"LettieDialogue_rom.dialogue": "Belladona ~{@",
		//"MinervaDialogue_rom.dialogue": "MomToxicated",
		"MinervaVelemirDialogue_rom.dialogue": "Minerva, Velimir",
		"QuincyDialogue_rom.dialogue": "Soldja1Shot1kil",
		//"VelimirDialogue_rom.dialogue": "PapaPolar",
		"LoidDialogue_rom.dialogue": "POM2_LAB1",
		"LyonDialogue_rom.dialogue": "Lyon",
		"MarieDialogue_rom.dialogue": "Marie",
		"RoatheDialogue_rom.dialogue": "Roathe",
	};

	Promise.all([
		fetch("dicts/en.json").then(res => res.json()),
		fetch("dicts/de.json").then(res => res.json()),
		fetch("dicts/es.json").then(res => res.json()),
		fetch("dicts/fr.json").then(res => res.json()),
		fetch("dicts/it.json").then(res => res.json()),
		fetch("dicts/ja.json").then(res => res.json()),
		fetch("dicts/ko.json").then(res => res.json()),
		fetch("dicts/pl.json").then(res => res.json()),
		fetch("dicts/pt.json").then(res => res.json()),
		fetch("dicts/ru.json").then(res => res.json()),
		fetch("dicts/tc.json").then(res => res.json()),
		fetch("dicts/th.json").then(res => res.json()),
		fetch("dicts/tr.json").then(res => res.json()),
		fetch("dicts/uk.json").then(res => res.json()),
		fetch("dicts/zh.json").then(res => res.json()),
		fetch("data/ArthurDialogue_rom.dialogue.json").then(res => res.json()),
		fetch("data/EleanorDialogue_rom.dialogue.json").then(res => res.json()),
		fetch("data/LettieDialogue_rom.dialogue.json").then(res => res.json()),
		fetch("data/JabirDialogue_rom.dialogue.json").then(res => res.json()),
		fetch("data/AoiDialogue_rom.dialogue.json").then(res => res.json()),
		fetch("data/QuincyDialogue_rom.dialogue.json").then(res => res.json()),
		fetch("data/HexDialogue_rom.dialogue.json").then(res => res.json()),
		fetch("data/LoidDialogue_rom.dialogue.json").then(res => res.json()),
		fetch("data/LyonDialogue_rom.dialogue.json").then(res => res.json()),
		fetch("data/MarieDialogue_rom.dialogue.json").then(res => res.json()),
		fetch("data/RoatheDialogue_rom.dialogue.json").then(res => res.json())
	]).then(([
		dict_en, dict_de, dict_es, dict_fr, dict_it, dict_ja, dict_ko, dict_pl, dict_pt, dict_ru, dict_tc, dict_th, dict_tr, dict_uk, dict_zh,
		ArthurDialogue_rom, EleanorDialogue_rom, LettieDialogue_rom, JabirDialogue_rom, AoiDialogue_rom, QuincyDialogue_rom, HexDialogue_rom, LoidDialogue_rom, LyonDialogue_rom, MarieDialogue_rom, RoatheDialogue_rom
	]) => {
		window.dicts = {
			en: dict_en,
			de: dict_de,
			es: dict_es,
			fr: dict_fr,
			it: dict_it,
			ja: dict_ja,
			ko: dict_ko,
			pl: dict_pl,
			pt: dict_pt,
			ru: dict_ru,
			tc: dict_tc,
			th: dict_th,
			tr: dict_tr,
			uk: dict_uk,
			zh: dict_zh,
		};
		window.chatrooms = {
			"ArthurDialogue_rom.dialogue": { nodes: ArthurDialogue_rom, convos: {} },
			"EleanorDialogue_rom.dialogue": { nodes: EleanorDialogue_rom, convos: {} },
			"LettieDialogue_rom.dialogue": { nodes: LettieDialogue_rom, convos: {} },
			"JabirDialogue_rom.dialogue": { nodes: JabirDialogue_rom, convos: {} },
			"AoiDialogue_rom.dialogue": { nodes: AoiDialogue_rom, convos: {} },
			"QuincyDialogue_rom.dialogue": { nodes: QuincyDialogue_rom, convos: {} },
			"HexDialogue_rom.dialogue": { nodes: HexDialogue_rom, convos: {} },
			"LoidDialogue_rom.dialogue": { nodes: LoidDialogue_rom, convos: {} },
			"LyonDialogue_rom.dialogue": { nodes: LyonDialogue_rom, convos: {} },
			"MarieDialogue_rom.dialogue": { nodes: MarieDialogue_rom, convos: {} },
			"RoatheDialogue_rom.dialogue": { nodes: RoatheDialogue_rom, convos: {} },
		};
		for (const [chatroom_name, chatroom] of Object.entries(chatrooms))
		{
			for (const node of chatroom.nodes)
			{
				if (node.Content && !node.Content.startsWith("/") && !node.Incoming && node.Outgoing)
				{
					const convo = node.Content;
					//convo_to_chatroom[convo] = chatroom_name;
					const pending = [ node.Id ];
					const done = [];
					while (pending.length != 0)
					{
						const node_id = pending.pop();
						if (done.find(x => x == node_id))
						{
							continue;
						}
						done.push(node_id);
						const n = chatroom.nodes[node_id];
						if (n.Outgoing)
						{
							for (const choice of n.Outgoing)
							{
								pending.push(choice);
							}
						}
						else if (n.TrueNodes)
						{
							for (const choice of n.TrueNodes)
							{
								pending.push(choice);
							}
							if (n.FalseNodes)
							{
								for (const choice of n.FalseNodes)
								{
									pending.push(choice);
								}
							}
						}
						else if (n.Outputs)
						{
							for (const output of n.Outputs)
							{
								for (const choice of output.Outgoing)
								{
									pending.push(choice);
								}
							}
						}
					}
					chatroom.convos[convo] = done;
				}
			}
		}

		const params = new URLSearchParams(location.hash.toString().replace("#", ""));
		if (params.has("lang"))
		{
			document.getElementById("lang").value = params.get("lang");
		}
		if (params.has("q"))
		{
			document.getElementById("query").value = params.get("q");
			doLocate();
		}

		document.getElementById("loading").classList.add("slv-hidden");
		document.getElementById("content").classList.remove("slv-hidden");
	});

	function node_id_to_convo(chatroom, node_id)
	{
		for (const [convo, convo_node_ids] of Object.entries(chatroom.convos))
		{
			for (const convo_node_id of convo_node_ids)
			{
				if (convo_node_id == node_id)
				{
					return convo;
				}
			}
		}
		console.error("node_id_to_convo failed", chatroom, node_id);
	}

	function normaliseText(text)
	{
		return text.toLowerCase().split("‘").join("'").split("’").join("'");
	}

	function doLocate()
	{
		const lang = document.getElementById("lang").value;
		const query = normaliseText(document.getElementById("query").value);
		if (query.length >= 3)
		{
			location.hash = "q=" + encodeURIComponent(query) + "&lang=" + lang;
			document.getElementById("results").innerHTML = "";
			const results_set = {};
			for (const [chatroom_name, chatroom] of Object.entries(chatrooms))
			{
				for (const node of chatroom.nodes)
				{
					let text;
					if (node.Content)
					{
						text = dicts[lang][node.Content] ?? node.Content;
						text = text.split("<RETRO_EMOJI_HEART>").join("<3");
					}
					if (text)
					{
						if (normaliseText(text).indexOf(query) != -1)
						{
							const convo = node_id_to_convo(chatroom, node.Id);

							let sender_name = "Drifter";
							if (text.indexOf("/Choice_") == -1)
							{
								sender_name = chatroom_to_username[chatroom_name];
								if (node.Speaker)
								{
									sender_name = node.Speaker;
									if (dicts[lang][sender_name])
									{
										sender_name = dicts[lang][sender_name];
									}
								}
							}

							const slug = convo + "+++" + sender_name + "+++" + text;
							if (slug in results_set)
							{
								continue;
							}
							results_set[slug] = true;

							const p = document.createElement("p");
							p.textContent = sender_name + ": " + text + " (" + convo + " • ";
							{
								const a = document.createElement("a");
								a.href = "./flowcharts_svg/" + lang + "/" + chatroom_name + "/" + convo + ".svg";
								a.target = "_blank";
								a.textContent = "Flowchart";
								p.appendChild(a);
							}
							p.innerHTML += ")";
							document.getElementById("results").appendChild(p);
						}
					}
				}
			}
		}
		else
		{
			location.hash = "lang=" + lang;
			document.getElementById("results").innerHTML = "<p>Please enter at least 3 characters.</p>";
		}
	}
	document.getElementById("lang").onchange = doLocate;
	document.getElementById("query").oninput = doLocate;
</script>
</html>
